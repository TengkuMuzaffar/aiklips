[project]
name = "aiklips"
version = "0.2.0"
description = "An open-source video editor you drive with Claude Code: cut, animate, remove backgrounds, face AR, undo/redo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pillow>=10.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "watchfiles>=0.21",
    "claude-agent-sdk>=0.2.182",
    "pywebview>=6.2.1",
    "python-multipart>=0.0.33",
    "websockets>=12",
]

[project.optional-dependencies]
# Fast background removal (MediaPipe) + face mesh / AR
ai = ["mediapipe>=0.10.14", "trimesh>=4.0"]
# High-quality background removal (BiRefNet via rembg, slower)
bg-quality = ["rembg[cpu]>=2.0.55"]
# Offline auto-captions with word timestamps
captions = ["faster-whisper>=1.0"]

[project.scripts]
vedit = "vedit.cli:main"
aiklips = "vedit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
