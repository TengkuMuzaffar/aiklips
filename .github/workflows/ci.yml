name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: runner.os != 'macOS'
      # setup-ffmpeg only ships x64 binaries; macos-latest runners are arm64
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      - run: uv sync --extra ai
      - run: uv run pytest -q
