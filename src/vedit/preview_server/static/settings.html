<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · aiklips</title>

<style>
:root {
  --bg: #0b0d10; --pane: #12151a; --pane2: #181c22; --pane3: #20252d; --line: #262c35; --line2: #333a45;
  --text: #e6e9ef; --muted: #8a93a3; --faint: #5d6574; --accent: #5eead4; --accent-ink: #062a25;
  --danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
body.embed { background: var(--pane); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--pane3); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button.icon { padding: 5px; width: 28px; height: 28px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); border-color: var(--line2); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
a { color: var(--accent); }
.ic { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.hint { color: var(--faint); font-size: 12px; }
.spacer { flex: 1; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
.spin.big { width: 22px; height: 22px; border-width: 3px; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .2; } }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--pane3); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 9px; display: none; z-index: 50; max-width: 80vw; box-shadow: 0 8px 30px #000a; }
#toast.err { border-color: var(--danger); color: #fecaca; }

/* ---- frame ---- */
header { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
header h1 { margin: 0; font-size: 15px; }
.logo { font-weight: 700; } .logo span { color: var(--accent); }
body.embed .logo { display: none; }
#wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); }
main { min-width: 0; }
nav { border-right: 1px solid var(--line); background: var(--pane); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
nav button { justify-content: flex-start; gap: 10px; background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; border-radius: 8px; }
nav button:hover { color: var(--text); border-color: transparent; background: var(--pane2); }
nav button.on { color: var(--text); background: var(--pane3); }
nav button.on .ic { color: var(--accent); }
nav .n { margin-left: auto; font-size: 11px; color: var(--warn); }
main { overflow: auto; padding: 22px 26px 40px; }
.page { max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
.page > p.lede { margin: -12px 0 0; color: var(--muted); }
h2 { margin: 0; font-size: 18px; }
section { display: flex; flex-direction: column; gap: 10px; }
section > h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
section > .sub { margin: -6px 0 0; color: var(--faint); font-size: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--pane2); }
@media (max-width: 680px) {
  #wrap { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; }
  nav button { flex: none; }
  main { padding: 16px 16px 32px; }
}

/* ---- models ---- */
.role { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 280px); gap: 6px 16px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.role:first-child { border-top: 0; }
.role .rt { display: flex; flex-direction: column; min-width: 0; }
.role .rt b { display: flex; gap: 8px; align-items: center; }
.role .rt span { color: var(--muted); font-size: 12px; }
.role select { width: 100%; }
.role .src { grid-column: 2; font-size: 11px; color: var(--faint); }
.role .src.saved { color: var(--accent); }
.tag { font-size: 10.5px; font-weight: 500; border-radius: 999px; padding: 0 7px; border: 1px solid var(--line2); color: var(--muted); }
.nums { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 14px; }
.nums label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.nums input { width: 110px; }
@media (max-width: 560px) { .role { grid-template-columns: 1fr; } .role .src { grid-column: 1; } }

/* ---- providers (moved from the editor's "Manage models" dialog) ---- */
.pv { border: 1px solid var(--line); border-radius: 12px; background: var(--pane2); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pv-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pv-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.pv-t .url { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 8px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #0b0d10; background: var(--c); }
.st-chip { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line2); color: var(--muted); flex: none; display: inline-flex; align-items: center; gap: 4px; }
.st-chip.ok { color: var(--ok); border-color: #1f5135; } .st-chip.bad { color: var(--warn); border-color: #5a4512; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px 3px 9px; border-radius: 999px; background: var(--pane3); border: 1px solid var(--line2); cursor: pointer; }
.mchip .ic { width: 12px; height: 12px; color: var(--faint); }
.mchip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.mchip.ok .dot { background: var(--ok); } .mchip.bad .dot { background: var(--danger); } .mchip.busy .dot { background: var(--warn); animation: blink 1s infinite; }
.mchip .x { padding: 0; width: 16px; height: 16px; border: none; background: transparent; color: var(--faint); border-radius: 50%; }
.mchip .x:hover { color: var(--danger); background: #0005; }
.mchip.add { background: transparent; border-style: dashed; color: var(--muted); padding-right: 9px; }
.mchip.add:hover { color: var(--text); border-color: var(--accent); }
.addm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.addm input[type=text] { flex: 1; min-width: 160px; }
.addm label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; }
.addm-err { width: 100%; display: flex; gap: 8px; align-items: center; color: var(--danger); font-size: 12px; }
.addm-err span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.addprov { justify-content: flex-start; gap: 12px; padding: 12px; border: 1px dashed var(--line2); border-radius: 12px; background: transparent; text-align: left; }
.addprov > .ic { width: 30px; height: 30px; padding: 7px; border-radius: 8px; background: var(--pane3); }
.addprov > span { display: flex; flex-direction: column; white-space: normal; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.tpl { justify-content: flex-start; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 12px; background: var(--pane2); border: 1px solid var(--line); text-align: left; white-space: normal; }
.tpl:hover { border-color: var(--accent); background: var(--pane3); }
.tpl-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tpl-t b { display: flex; align-items: center; gap: 8px; }
.tpl-t > span { color: var(--muted); font-size: 12px; line-height: 1.4; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.stp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); padding: 3px 10px 3px 4px; border-radius: 999px; border: 1px solid var(--line); }
.stp i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--pane3); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
.stp i .ic { width: 11px; height: 11px; }
.stp.on { color: var(--text); border-color: var(--accent); } .stp.on i { background: var(--accent); color: var(--accent-ink); }
.stp.done { color: var(--muted); } .stp.done i { background: #15322e; color: var(--accent); }
.wiz { display: flex; flex-direction: column; gap: 14px; }
.wiz h4 { margin: 0; font-size: 14px; }
.wiz-head { display: flex; gap: 12px; align-items: center; }
.wiz-head p { margin: 2px 0 0; }
.fields { display: grid; grid-template-columns: minmax(80px, 30%) minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.fields > label { color: var(--muted); font-size: 12px; }
.fields .full { grid-column: 1 / 3; }
.fields input, .fields textarea { width: 100%; }
.keyrow { display: flex; gap: 10px; align-items: center; }
.keyrow input { flex: 1; }
.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.adv textarea { font: 11px ui-monospace, monospace; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.btnrow.end { justify-content: flex-end; }
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wlist.scroll { max-height: 320px; overflow: auto; padding-right: 2px; }
.wrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--pane2); cursor: pointer; }
.wrow.on { border-color: var(--line2); }
.wrow .wn { display: flex; flex-direction: column; min-width: 0; }
.wrow .wn code { font: 11px ui-monospace, monospace; color: var(--faint); }
.wrow .vis { padding: 2px 8px; font-size: 11px; border-radius: 999px; color: var(--faint); background: transparent; }
.wrow .vis .ic { width: 12px; height: 12px; }
.wrow .vis.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wrow .res { flex: 1; min-width: 0; text-align: right; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; justify-content: flex-end; align-items: center; gap: 4px; }
.wrow .res .ic { width: 12px; height: 12px; }
.wrow .res.ok { color: var(--ok); } .wrow .res.bad { color: var(--danger); }
.found { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--pane2); }
.found .ic { width: 14px; height: 14px; }
.found.ok { color: var(--ok); } .found.ok .hint { color: var(--muted); }
.found.bad { color: var(--warn); } .found.bad span { flex: 1; }
.usenow { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.ext { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; text-decoration: none; }
.ext .ic { width: 12px; height: 12px; }
.codeline { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 3px 3px 10px; }
.codeline code { flex: 1; min-width: 0; font: 11px ui-monospace, monospace; overflow-x: auto; white-space: nowrap; }
.waitbox { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line2); }
.waitbox .row { display: flex; gap: 10px; align-items: center; }

/* ---- permissions ---- */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--pane2); border-color: var(--line); text-align: left; white-space: normal; }
.seg button span { color: var(--muted); font-size: 12px; font-weight: 400; }
.seg button.on { border-color: var(--accent); background: #10302b; }
.seg button.on b { color: var(--accent); }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rules .card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rules h4 { margin: 0; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.rules h4 .ic { width: 15px; height: 15px; }
.rules .yes h4 .ic { color: var(--ok); } .rules .no h4 .ic { color: var(--warn); }
.rule b { display: block; font-weight: 500; }
.rule span { color: var(--faint); font-size: 12px; word-break: break-word; }
.allow { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.allow + .allow { border-top: 1px solid var(--line); }
.allow-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.allow-h .hint { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 12px ui-monospace, monospace; padding: 2px 4px 2px 9px; border-radius: 999px; background: var(--pane3); border: 1px solid var(--line2); }
.chip button { padding: 0; width: 18px; height: 18px; border: 0; background: transparent; color: var(--faint); border-radius: 50%; }
.chip button:hover { color: var(--text); background: #0005; }
.chip button.rm:hover { color: var(--danger); }
.chip button .ic { width: 12px; height: 12px; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; max-width: 260px; font-family: ui-monospace, monospace; }
.decl { padding: 4px 14px; }
.decl .rule { padding: 10px 0; border-top: 1px solid var(--line); }
.decl .rule:first-child { border-top: 0; }
@media (max-width: 620px) { .rules, .seg { grid-template-columns: 1fr; } }

/* ---- usage ---- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile span { color: var(--muted); font-size: 12px; }
.tile b { font-size: 20px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--faint); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
td .bar { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--accent); opacity: .7; }
td small { display: block; color: var(--faint); font: 11px ui-monospace, monospace; }
.tablewrap { overflow-x: auto; }
@media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header>
  <div class="logo">ai<span>klips</span></div>
  <h1>Settings</h1>

</header>
<div id="wrap">
  <nav id="nav"></nav>
  <main><div class="page" id="page"></div></main>
</div>

<script>
"use strict";
// Settings: which model does what, provider registration (API keys), what the AI may do, and usage.

  const visLabel = (v) => (v === true ? "vision" : v === false ? "no vision" : "vision?");

        icon("eye"), visLabel(m.vision)),

    f.busy ? "" : list,

      h("button", { onclick: addCustom }, icon("plus"), "Add")),
    h("label", { class: "usenow" }, h("input", { type: "checkbox", checked: WIZ.use, onchange: (e) => (WIZ.use = e.target.checked) }), "Switch the AI editor to the first selected model when done"),
    h("div", { class: "btnrow end" },
      h("button", { class: "ghost", onclick: () => { WIZ.step = 2; WIZ.edit = PUB.providers.find((p) => p.id === WIZ.pid); render(); } }, "Back"),
      failed ? h("button", { class: "ghost", onclick: () => finish(true) }, "Add anyway") : "",
      h("button", { class: "primary", disabled: testing || f.busy, onclick: () => finish(false) }, testing ? [h("span", { class: "spin" }), "Testing…"] : failed ? "Test again" : "Test & finish"))];
}
function pageProviders() {
  if (WIZ) return [h("h2", {}, WIZ.edit ? "Provider settings" : "Connect a provider"),

// ---------- Permissions ----------
async function loadPerm() { PERM = await get("/api/settings/permissions"); render(); }
async function permApi(body) { const r = await api("/api/settings/permissions", body); if (r) { PERM = r; render(); } return r; }
function allowList(scope, items, title, note) {
  let val = "";
  const add = async (inp) => { if (!val) return; if (await permApi({ scope, add: val })) { toast(`Always allowing ${val}`); inp.value = ""; } };
  const inp = h("input", { type: "text", placeholder: "program or tool, e.g. ffmpeg", spellcheck: false, oninput: (e) => (val = e.target.value.trim()), onkeydown: (e) => e.key === "Enter" && add(e.target) });
  return h("div", { class: "allow" },
    h("div", { class: "allow-h" }, h("b", {}, title), h("span", { class: "hint" }, note)),
    items.length ? h("div", { class: "chips" }, items.map((x) => h("span", { class: "chip" }, x,
      scope === "project" && !PERM.always_allow.includes(x) ? h("button", { title: "Allow in every project", onclick: () => permApi({ scope: "global", add: x }).then((r) => r && permApi({ scope: "project", remove: x })) }, icon("up")) : "",
      h("button", { class: "rm", title: "Ask again", onclick: () => permApi({ scope, remove: x }) }, icon("x")))))
      : h("span", { class: "hint" }, "Nothing yet."),
    h("div", { class: "addrow" }, inp, h("button", { onclick: () => add(inp) }, icon("plus"), "Allow")));
}
function pagePermissions() {
  if (!PERM) return [h("h2", {}, "Permissions"), h("p", { class: "hint" }, h("span", { class: "spin" }), " Loading…")];
  const R = PERM.rules;
  const rule = (r) => h("div", { class: "rule" }, h("b", {}, r.title), h("span", {}, r.detail));
  const mode = (v, t, d) => h("button", { class: PERM.unlisted === v ? "on" : "", onclick: () => PERM.unlisted !== v && permApi({ unlisted: v }).then((r) => r && toast("Saved")) }, h("b", {}, t), h("span", {}, d));
  return [
    h("h2", {}, "Permissions"),
    h("p", { class: "lede" }, "What the AI editor may do on your computer without asking you first."),
    h("section", {}, h("h3", {}, "When the AI wants something not allowed below"),
      h("div", { class: "seg" },
        mode("ask", "Ask me in the chat", "You get Allow / Deny / Always allow. Recommended."),
        mode("deny", "Block without asking", "The AI is told no and tries a vedit command instead. Good for leaving it to work alone."))),
    h("section", {}, h("h3", {}, "Your always-allow list"),
      h("p", { class: "sub" }, "Programs or tools you've said yes to for good. “Always allow” in the chat adds to this project's list."),
      h("div", { class: "card" },
        allowList("global", PERM.always_allow, "All projects", "~/.aiklips/permissions.json"),
        PERM.project != null ? allowList("project", PERM.project_allow || [], `This project · ${PERM.project}`, "only while it's open") : "")),
    h("section", {}, h("h3", {}, "Built-in rules"), h("p", { class: "sub" }, "These can't be changed, so the AI can never delete your footage or run arbitrary code unasked."),
      h("div", { class: "rules" },
        h("div", { class: "card yes" }, h("h4", {}, icon("shield-check"), "Always allowed"), R.allowed.map(rule)),
        h("div", { class: "card no" }, h("h4", {}, icon("hand"), "Always asks"), R.always_ask.map(rule)))),
    h("section", {}, h("h3", {}, "Your data and the AI"),
      h("div", { class: "card decl" }, R.data.map(rule))),
  ];
}

// ---------- Usage ----------
const TASKS = { chat: "AI editor chat", study: "Watcher · references", footage: "Watcher · footage", classify: "Watcher · sound check",
  planner: "Creative director · plan", concepts: "Creative director · concepts", rank: "Creative director · ranking", editor: "Editor", auditor: "Auditor",
  critic: "Auditor (older version)", fixer: "Editor · fixes (older version)" };
async function loadUsage() { USAGE = await get(`/api/settings/usage?days=${USAGE_DAYS}`); render(); }
function pageUsage() {
  const period = h("select", { onchange: (e) => { USAGE_DAYS = Number(e.target.value); USAGE = null; loadUsage(); render(); } },
    [[7, "Last 7 days"], [30, "Last 30 days"], [90, "Last 90 days"], [365, "Last year"]].map(([v, l]) => h("option", { value: v, selected: v === USAGE_DAYS }, l)));
  const head = [h("div", { style: { display: "flex", alignItems: "center", gap: "12px" } }, h("h2", {}, "Usage"), h("span", { class: "spacer" }), period),
    h("p", { class: "lede" }, "AI calls made from this computer. Token counts come from each provider; cost only when the provider reports it.")];
  if (!USAGE) return [...head, h("p", { class: "hint" }, h("span", { class: "spin" }), " Loading…")];
  const T = USAGE.total;
  if (!T.calls) return [...head, h("div", { class: "card", style: { padding: "18px" } }, h("b", {}, "No AI calls yet in this period."),
    h("p", { class: "hint", style: { margin: "4px 0 0" } }, "Chat with the AI editor or run a generation and it shows up here."))];
  const tile = (label, value, small) => h("div", { class: "card tile" }, h("span", {}, label), h("b", {}, value), small ? h("small", {}, small) : "");
  const max = Math.max(...USAGE.models.map((m) => m.calls), 1);
  const costCell = (r) => (r.cost_known ? usd(r.cost_usd) + (r.cost_known < r.calls ? "*" : "") : "—");
  const table = (rows, first, name) => h("div", { class: "card tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, first), h("th", {}, "Calls"), h("th", {}, "Tokens in"), h("th", {}, "Tokens out"), h("th", {}, "Cost"))),
    h("tbody", {}, rows.map((r) => h("tr", {}, h("td", {}, name(r)), h("td", {}, r.calls), h("td", {}, num(r.input_tokens)), h("td", {}, num(r.output_tokens)), h("td", {}, costCell(r)))))));
  const partial = [...USAGE.models].some((r) => r.cost_known && r.cost_known < r.calls);
  return [...head,
    h("div", { class: "tiles" },
      tile("AI calls", num(T.calls)), tile("Tokens in", num(T.input_tokens), "incl. cached"), tile("Tokens out", num(T.output_tokens)),
      tile("Reported cost", T.cost_known ? usd(T.cost_usd) : "—", T.cost_known < T.calls ? `${T.calls - T.cost_known} calls without a price` : "")),
    h("section", {}, h("h3", {}, "By model"), table(USAGE.models, "Model", (r) => [r.label, h("small", {}, r.key), h("i", { class: "bar", style: { width: `${(r.calls / max) * 100}%` } })])),
    h("section", {}, h("h3", {}, "By job"), table(USAGE.tasks, "Job", (r) => TASKS[r.key] || r.key)),
    partial ? h("p", { class: "hint" }, "* some calls in this row had no reported price.") : "",
  ];
}

// ---------- Updates ----------
async function loadUpdates() { UPD = await get("/api/update"); render(); }
async function updAction(label, url, body) {
  UPD_BUSY = label; render();
  const r = await api(url, body);
  UPD_BUSY = "";
  if (r) UPD = r;
  render();
  return r;
}
async function restartApp() {
  UPD_BUSY = "Restarting…"; render();
  if (await api("/api/update/restart")) {
    $("#page").replaceChildren(h("p", { class: "hint" }, h("span", { class: "spin" }), " Restarting aiklips — this window reopens in a moment."));
  } else { UPD_BUSY = ""; render(); }
}
function pageUpdates() {
  const head = [h("h2", {}, "Updates"), h("p", { class: "lede" }, "New versions come from the project's GitHub releases. They're signed, checked before installing, and your projects are never touched.")];
  if (!UPD) return [...head, h("p", { class: "hint" }, h("span", { class: "spin" }), " Loading…")];
  const U = UPD;
  if (!U.enabled) return [...head, h("div", { class: "card", style: { padding: "18px" } },
    h("b", {}, `aiklips ${U.current} (running from source)`),
    h("p", { class: "hint", style: { margin: "6px 0 10px" } }, "This copy runs from a source checkout, so it updates with git instead:"), codeLine("git pull && uv sync"))];
  const when = U.checked_at ? new Date(U.checked_at * 1000).toLocaleString() : "never";
  const busy = !!UPD_BUSY;
  let main;
  if (U.staged) main = [h("b", {}, `Version ${U.staged} is downloaded`), h("p", { class: "hint" }, "Restart to install it. If it doesn't start properly, aiklips goes back to this version on its own."),
    h("button", { class: "primary", disabled: busy, onclick: restartApp }, "Restart to update")];
  else if (U.available) main = [h("b", {}, `Version ${U.latest} is available`), h("p", { class: "hint" }, `You have ${U.current}.`),
    h("button", { class: "primary", disabled: busy, onclick: () => updAction("Downloading…", "/api/update/apply").then((r) => r && toast(`Downloaded ${r.staged}`)) }, icon("download"), "Download update")];
  else main = [h("b", {}, `aiklips ${U.current} is up to date`), h("p", { class: "hint" }, `Last checked: ${when}`)];
  return [...head,
    h("div", { class: "card", style: { padding: "18px", display: "grid", gap: "8px", justifyItems: "start" } }, ...main,
      busy ? h("p", { class: "hint" }, h("span", { class: "spin" }), " ", UPD_BUSY) : ""),
    U.available && U.notes ? h("section", {}, h("h3", {}, `What's new in ${U.latest}`), h("pre", { class: "card", style: { padding: "12px", whiteSpace: "pre-wrap", margin: 0 } }, U.notes)) : "",
    h("section", {}, h("h3", {}, "Options"), h("div", { class: "card", style: { padding: "14px", display: "grid", gap: "10px", justifyItems: "start" } },
      h("label", { style: { display: "flex", gap: "8px", alignItems: "center" } },
        h("input", { type: "checkbox", checked: U.auto, onchange: (e) => updAction("", "/api/update/auto", { on: e.target.checked }) }), "Check for updates automatically"),
      h("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } },
        h("button", { disabled: busy, onclick: () => updAction("Checking…", "/api/update/check") }, "Check now"),
        U.previous ? h("button", { class: "ghost", disabled: busy, title: "Use the version you had before; takes effect on restart",
          onclick: async () => { if (confirm(`Go back to version ${U.previous}?`) && await updAction("", "/api/update/rollback")) restartApp(); } }, `Go back to ${U.previous}`) : "",
        U.url ? ext(U.url, "Release notes") : ""))),
  ];
}
