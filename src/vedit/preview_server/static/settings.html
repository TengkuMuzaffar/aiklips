<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · aiklips</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
:root {
  --bg: #0b0d10; --pane: #12151a; --pane2: #181c22; --pane3: #20252d; --line: #262c35; --line2: #333a45;
  --text: #e6e9ef; --muted: #8a93a3; --faint: #5d6574; --accent: #c5f467; --accent-ink: #0b2a1d;
  --danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
body.embed { background: var(--pane); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--pane3); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button.icon { padding: 5px; width: 28px; height: 28px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); border-color: var(--line2); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
a { color: var(--accent); }
.ic { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.hint { color: var(--faint); font-size: 12px; }
.spacer { flex: 1; }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
.spin.big { width: 22px; height: 22px; border-width: 3px; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .2; } }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--pane3); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 9px; display: none; z-index: 50; max-width: 80vw; box-shadow: 0 8px 30px #000a; }
#toast.err { border-color: var(--danger); color: #fecaca; }

/* ---- frame ---- */
header { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--pane); }
header h1 { margin: 0; font-size: 15px; }
.logo { font-weight: 700; } .logo span { color: var(--accent); }
body.embed .logo { display: none; }
#wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); }
main { min-width: 0; }
nav { border-right: 1px solid var(--line); background: var(--pane); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
nav button { justify-content: flex-start; gap: 10px; background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; border-radius: 8px; }
nav button:hover { color: var(--text); border-color: transparent; background: var(--pane2); }
nav button.on { color: var(--text); background: var(--pane3); }
nav button.on .ic { color: var(--accent); }
nav .n { margin-left: auto; font-size: 11px; color: var(--warn); }
main { overflow: auto; padding: 22px 26px 40px; }
.page { max-width: 760px; display: flex; flex-direction: column; gap: 22px; }
.page > p.lede { margin: -12px 0 0; color: var(--muted); }
h2 { margin: 0; font-size: 18px; }
section { display: flex; flex-direction: column; gap: 10px; }
section > h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
section > .sub { margin: -6px 0 0; color: var(--faint); font-size: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; background: var(--pane2); }
@media (max-width: 680px) {
  #wrap { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px 8px; }
  nav button { flex: none; }
  main { padding: 16px 16px 32px; }
}

/* ---- models ---- */
.role { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 280px); gap: 6px 16px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.role:first-child { border-top: 0; }
.role .rt { display: flex; flex-direction: column; min-width: 0; }
.role .rt b { display: flex; gap: 8px; align-items: center; }
.role .rt span { color: var(--muted); font-size: 12px; }
.role select { width: 100%; }
.role .src { grid-column: 2; font-size: 11px; color: var(--faint); }
.role .src.saved { color: var(--accent); }
.tag { font-size: 10.5px; font-weight: 500; border-radius: 999px; padding: 0 7px; border: 1px solid var(--line2); color: var(--muted); }
.nums { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 14px; }
.nums label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
.nums input { width: 110px; }
@media (max-width: 560px) { .role { grid-template-columns: 1fr; } .role .src { grid-column: 1; } }

/* ---- providers (moved from the editor's "Manage models" dialog) ---- */
.pv { border: 1px solid var(--line); border-radius: 12px; background: var(--pane2); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pv-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pv-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.pv-t .url { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 8px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #0b0d10; background: var(--c); }
.st-chip { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line2); color: var(--muted); flex: none; display: inline-flex; align-items: center; gap: 4px; }
.st-chip.ok { color: var(--ok); border-color: #1f5135; } .st-chip.bad { color: var(--warn); border-color: #5a4512; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 6px 3px 9px; border-radius: 999px; background: var(--pane3); border: 1px solid var(--line2); cursor: pointer; }
.mchip .ic { width: 12px; height: 12px; color: var(--faint); }
.mchip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.mchip.ok .dot { background: var(--ok); } .mchip.bad .dot { background: var(--danger); } .mchip.busy .dot { background: var(--warn); animation: blink 1s infinite; }
.mchip .x { padding: 0; width: 16px; height: 16px; border: none; background: transparent; color: var(--faint); border-radius: 50%; }
.mchip .x:hover { color: var(--danger); background: #0005; }
.mchip.add { background: transparent; border-style: dashed; color: var(--muted); padding-right: 9px; }
.mchip.add:hover { color: var(--text); border-color: var(--accent); }
.addm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.addm input[type=text] { flex: 1; min-width: 160px; }
.addm label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12px; }
.addm-err { width: 100%; display: flex; gap: 8px; align-items: center; color: var(--danger); font-size: 12px; }
.addm-err span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.addprov { justify-content: flex-start; gap: 12px; padding: 12px; border: 1px dashed var(--line2); border-radius: 12px; background: transparent; text-align: left; }
.addprov > .ic { width: 30px; height: 30px; padding: 7px; border-radius: 8px; background: var(--pane3); }
.addprov > span { display: flex; flex-direction: column; white-space: normal; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.tpl { justify-content: flex-start; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 12px; background: var(--pane2); border: 1px solid var(--line); text-align: left; white-space: normal; }
.tpl:hover { border-color: var(--accent); background: var(--pane3); }
.tpl-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.tpl-t b { display: flex; align-items: center; gap: 8px; }
.tpl-t > span { color: var(--muted); font-size: 12px; line-height: 1.4; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.stp { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); padding: 3px 10px 3px 4px; border-radius: 999px; border: 1px solid var(--line); }
.stp i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--pane3); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
.stp i .ic { width: 11px; height: 11px; }
.stp.on { color: var(--text); border-color: var(--accent); } .stp.on i { background: var(--accent); color: var(--accent-ink); }
.stp.done { color: var(--muted); } .stp.done i { background: #22331a; color: var(--accent); }
.wiz { display: flex; flex-direction: column; gap: 14px; }
.wiz h4 { margin: 0; font-size: 14px; }
.wiz-head { display: flex; gap: 12px; align-items: center; }
.wiz-head p { margin: 2px 0 0; }
.fields { display: grid; grid-template-columns: minmax(80px, 30%) minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.fields > label { color: var(--muted); font-size: 12px; }
.fields .full { grid-column: 1 / 3; }
.fields input, .fields textarea { width: 100%; }
.keyrow { display: flex; gap: 10px; align-items: center; }
.keyrow input { flex: 1; }
.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.adv textarea { font: 11px ui-monospace, monospace; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.btnrow.end { justify-content: flex-end; }
.wlist { display: flex; flex-direction: column; gap: 6px; }
.wlist.scroll { max-height: 320px; overflow: auto; padding-right: 2px; }
.wrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--pane2); cursor: pointer; }
.wrow.on { border-color: var(--line2); }
.wrow .wn { display: flex; flex-direction: column; min-width: 0; }
.wrow .wn code { font: 11px ui-monospace, monospace; color: var(--faint); }
.wrow .vis { padding: 2px 8px; font-size: 11px; border-radius: 999px; color: var(--faint); background: transparent; }
.wrow .vis .ic { width: 12px; height: 12px; }
.wrow .vis.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wrow .res { flex: 1; min-width: 0; text-align: right; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; justify-content: flex-end; align-items: center; gap: 4px; }
.wrow .res .ic { width: 12px; height: 12px; }
.wrow .res.ok { color: var(--ok); } .wrow .res.bad { color: var(--danger); }
.found { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--pane2); }
.found .ic { width: 14px; height: 14px; }
.found.ok { color: var(--ok); } .found.ok .hint { color: var(--muted); }
.found.bad { color: var(--warn); } .found.bad span { flex: 1; }
.usenow { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.ext { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; text-decoration: none; }
.ext .ic { width: 12px; height: 12px; }
.codeline { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; padding: 3px 3px 3px 10px; }
.codeline code { flex: 1; min-width: 0; font: 11px ui-monospace, monospace; overflow-x: auto; white-space: nowrap; }
.waitbox { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line2); }
.waitbox .row { display: flex; gap: 10px; align-items: center; }

/* ---- permissions ---- */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--pane2); border-color: var(--line); text-align: left; white-space: normal; }
.seg button span { color: var(--muted); font-size: 12px; font-weight: 400; }
.seg button.on { border-color: var(--accent); background: #1f2e15; }
.seg button.on b { color: var(--accent); }
.rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rules .card { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.rules h4 { margin: 0; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.rules h4 .ic { width: 15px; height: 15px; }
.rules .yes h4 .ic { color: var(--ok); } .rules .no h4 .ic { color: var(--warn); }
.rule b { display: block; font-weight: 500; }
.rule span { color: var(--faint); font-size: 12px; word-break: break-word; }
.allow { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.allow + .allow { border-top: 1px solid var(--line); }
.allow-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.allow-h .hint { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 12px ui-monospace, monospace; padding: 2px 4px 2px 9px; border-radius: 999px; background: var(--pane3); border: 1px solid var(--line2); }
.chip button { padding: 0; width: 18px; height: 18px; border: 0; background: transparent; color: var(--faint); border-radius: 50%; }
.chip button:hover { color: var(--text); background: #0005; }
.chip button.rm:hover { color: var(--danger); }
.chip button .ic { width: 12px; height: 12px; }
.addrow { display: flex; gap: 6px; }
.addrow input { flex: 1; max-width: 260px; font-family: ui-monospace, monospace; }
.decl { padding: 4px 14px; }
.decl .rule { padding: 10px 0; border-top: 1px solid var(--line); }
.decl .rule:first-child { border-top: 0; }
@media (max-width: 620px) { .rules, .seg { grid-template-columns: 1fr; } }

/* ---- usage ---- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.tile span { color: var(--muted); font-size: 12px; }
.tile b { font-size: 20px; font-variant-numeric: tabular-nums; }
.tile small { color: var(--faint); font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 8px 14px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
td .bar { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--accent); opacity: .7; }
td small { display: block; color: var(--faint); font: 11px ui-monospace, monospace; }
.tablewrap { overflow-x: auto; }
@media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* ---- refreshed shell (ui.css tokens) ---- */
header { height: 56px; padding: 0 14px 0 18px; gap: 12px; }
header h1 { font-size: 15px; font-weight: 650; }
.brand { display: flex; align-items: center; gap: 9px; padding-right: 12px; margin-right: 2px; border-right: 1px solid var(--line); }
body.embed .brand { display: none; }
#wrap { grid-template-columns: 224px minmax(0, 1fr); }
nav { padding: 14px 10px; gap: 3px; }
nav button { padding: 9px 11px; border-radius: 9px; font-size: 13.5px; font-weight: 550; position: relative; }
nav button.on::before { content: ""; position: absolute; left: -10px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
nav .ver { margin-top: auto; padding: 10px 11px 0; color: var(--faint); font-size: 11.5px; }
main { padding: 30px 36px 60px; }
.page { max-width: 780px; animation: ak-rise var(--t-slow) var(--ease-out) both; }
h2 { font-size: 22px; letter-spacing: -.015em; }
.card { border-radius: 14px; }
/* general tab rows */
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 18px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .pt { display: flex; flex-direction: column; min-width: 0; }
.prow .pt b { font-weight: 600; } .prow .pt span { color: var(--muted); font-size: 12.5px; }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 22px; background: var(--pane3); border: 1px solid var(--line2); transition: background-color var(--t) var(--ease), border-color var(--t) var(--ease); }
.switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform var(--t) var(--spring), background-color var(--t) var(--ease); }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); background: var(--accent-ink); }
.switch input:focus-visible + i { box-shadow: 0 0 0 3px var(--accent-soft); }
.fmts { display: flex; gap: 6px; flex-wrap: wrap; }
.fmts button { padding: 6px 10px; border-radius: 9px; background: var(--pane3); }
.fmts button i { display: inline-block; border: 1.6px solid currentColor; border-radius: 2px; }
.fmts button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.about { display: flex; gap: 16px; align-items: center; padding: 18px; }
.about img { width: 56px; height: 56px; }
.about b { font-size: 16px; } .about p { margin: 2px 0 8px; color: var(--muted); }
.about .links { display: flex; gap: 14px; flex-wrap: wrap; }
nav .nsearch { position: relative; display: flex; align-items: center; margin: 0 0 10px; }
nav .nsearch .ic { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--faint); pointer-events: none; }
nav .nsearch input { width: 100%; padding: 7px 10px 7px 30px; border-radius: 9px; background: var(--bg); }
nav .ngroup { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; padding: 12px 11px 5px; }
nav .ngroup:first-of-type { padding-top: 2px; }
nav .nhits { display: flex; flex-direction: column; gap: 2px; animation: ak-rise var(--t) var(--ease-out) both; }
nav .nhits button { flex-direction: column; align-items: flex-start; gap: 0; }
nav .nhits small { color: var(--faint); font-size: 11px; font-weight: 400; }
nav .nnone { color: var(--faint); font-size: 12px; padding: 6px 11px; }
.chart { padding: 16px 16px 10px; }
.cbars { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
.cbars i { flex: 1; min-width: 2px; border-radius: 3px 3px 1px 1px; background: linear-gradient(var(--accent), #8fbf3c); opacity: .85; transform-origin: bottom; animation: cgrow .6s var(--ease-out) both; transition: opacity var(--t-fast); }
.cbars i.zero { background: var(--line2); opacity: .6; }
.cbars i:hover { opacity: 1; box-shadow: 0 0 0 1px var(--accent); }
@keyframes cgrow { from { transform: scaleY(0); } }
.caxis { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 11.5px; color: var(--faint); }
.caxis .ctip { color: var(--text); font-variant-numeric: tabular-nums; }
.uhero { display: flex; gap: 18px; align-items: center; padding: 20px; }
.uhero.new { border-color: #c5f46755; background: linear-gradient(110deg, #c5f46714, var(--pane2) 60%); }
.uh-logo { position: relative; flex: none; }
.uh-logo img { width: 64px; height: 64px; display: block; }
.uh-badge { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); border: 3px solid var(--pane2); }
.uh-badge .ic { width: 13px; height: 13px; }
.uhero.busy .uh-badge .ic { animation: ak-spin 1s linear infinite; }
.uh-t { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.uh-t b { font-size: 17px; letter-spacing: -.01em; } .uh-t > span { color: var(--muted); }
.uh-t .btnrow { margin-top: 8px; }
.hl { display: grid; grid-template-columns: 1fr 1fr; }
.hl-i { padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); }
.hl-i:nth-child(-n+2) { border-top: 0; } .hl-i:nth-child(odd) { border-right: 1px solid var(--line); }
.hl-i span { color: var(--muted); font-size: 12.5px; }
@media (max-width: 680px) { nav .nsearch, nav .ngroup, nav .ver { display: none; } .hl { grid-template-columns: 1fr; } .hl-i:nth-child(odd) { border-right: 0; } }
.notes { margin: 0; padding: 12px 16px 12px 32px; display: grid; gap: 6px; }
.notes li { color: var(--text); } .notes li::marker { color: var(--accent); }
</style>

function icon(name) {

}
function toast(msg, err = false) { AK.toast(msg, err); }
async function api(url, body) {

    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { let d = "Error"; try { d = (await r.json()).detail; } catch {} toast(d, true); return null; }
    return r.json();
  } catch { toast("Can't reach aiklips — is it still running?", true); return null; }
}
const get = async (url) => { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? r.json() : null; } catch { return null; } };

const PROVIDER_COLORS = { anthropic: "#d97757", openai: "#10a37f", deepseek: "#4d6bfe", opencode: "#a3a3a3" };
function avatar(id, name) {
  let c = PROVIDER_COLORS[id];
  if (!c) { let hsh = 0; for (const ch of id) hsh = (hsh * 31 + ch.charCodeAt(0)) % 360; c = `hsl(${hsh} 55% 58%)`; }
  return h("span", { class: "av", style: { "--c": c } }, (name || id || "?").trim()[0].toUpperCase());
}

// ---------- state + routing ----------
const TABS = [

const FIND = [
  ["format aspect ratio reels tiktok youtube square default new project", "Default format", "general"],

  ["motion animation reduce calm accessibility", "Reduce motion", "general"], ["tour welcome onboarding help", "Welcome tour", "general"],
  ["whats new changelog release notes", "What's new", "general"], ["about version licence website github bug report problem", "About aiklips", "general"],
  ["update upgrade version download restart rollback auto", "Updates", "updates"],

  ["pass mark audit score rounds revision", "Auditor pass mark", "models"],

  const [tab, sub, arg] = location.hash.slice(1).split("/");
  TAB = TABS.some((t) => t[0] === tab) ? tab : "general";
  if (TAB === "providers" && sub === "add" && !WIZ) WIZ = { step: 1 };
  if (TAB === "providers" && sub === "edit" && PUB) { const pv = PUB.providers.find((p) => p.id === decodeURIComponent(arg || "")); if (pv && !pv.builtin) editProvider(pv, false); }

// where Back goes: the aiklips page that opened Settings (home or a tab of it), else the home screen

async function loadAll() {
  [, PUB, AI, SET, ROLES, AUDIT] = await Promise.all([AK.load(), get("/api/models"), get("/api/ai/status"), get("/api/settings"), get("/api/ai/roles"), get("/api/audit/settings")]);
  route();
}
async function refreshModels(pub) { PUB = pub || await get("/api/models"); ROLES = await get("/api/ai/roles"); changed("models"); render(); }

function render() {
  const unready = PUB ? PUB.providers.filter((p) => !p.ready).length + (AI && !readyBuiltin() ? 1 : 0) : 0;
  const q = FINDQ.trim().toLowerCase();
  const hits = q ? FIND.filter(([w, l]) => (w + " " + l.toLowerCase()).includes(q)) : [];
  const search = h("label", { class: "nsearch" }, icon("search"), h("input", { type: "search", placeholder: "Search settings", value: FINDQ, "aria-label": "Search settings",

    onkeydown: (e) => { if (e.key === "Enter" && hits[0]) { FINDQ = ""; go(hits[0][2]); } if (e.key === "Escape") { FINDQ = ""; render(); } } }));

  let g = null;
  for (const [id, label, ic, grp] of TABS) {
    if (grp !== g) { g = grp; groups.push(h("div", { class: "ngroup" }, grp)); }
    groups.push(h("button", { class: TAB === id ? "on" : "", onclick: () => { if (id !== "providers") WIZ = null; go(id); } },

  }

    ...(q ? [hits.length ? h("div", { class: "nhits" }, hits.map(([, l, t]) => h("button", { onclick: () => { FINDQ = ""; go(t); } },
      h("span", {}, l), h("small", {}, TABS.find((x) => x[0] === t)[1])))) : h("div", { class: "nnone" }, "No setting matches.")] : groups),
    h("div", { class: "ver" }, AK.app ? `aiklips ${AK.app.version}` : ""));

  if (!PUB) return page.replaceChildren(h("p", { class: "hint" }, h("span", { class: "spin" }), " Loading…"));

// ---------- Models ----------
function modelOptions(cur, { vision = false, dflt = null } = {}) {
  const out = dflt ? [h("option", { value: "", selected: !cur }, dflt)] : [];
  for (const pv of PUB.providers) {
    const ms = PUB.models.filter((m) => m.provider === pv.id && (!vision || m.vision !== false));
    if (!ms.length) continue;
    out.push(h("optgroup", { label: pv.name + (pv.ready ? "" : " · needs sign-in or key") },
      ms.map((m) => h("option", { value: m.key, selected: m.key === cur, disabled: !pv.ready && m.key !== cur }, m.label + (m.vision ? "" : " · no vision")))));
  }
  return out;
}
const labelOf = (k) => { const m = PUB.models.find((x) => x.key === k); return m ? m.label : k; };
function pageModels() {
  const cur = SET?.chat_model || SET?.chat_default;
  const chat = h("select", { onchange: async (e) => {
    const r = await api("/api/settings/chat-model", { model: e.target.value });
    if (r) { SET = r; changed("chat"); toast(`AI editor now uses ${labelOf(e.target.value)}`); render(); } else render();
  } }, modelOptions(cur));
  const chatNote = SET?.project
    ? (SET.chat_model && SET.chat_model !== SET.chat_default ? `“${SET.project}” uses ${labelOf(SET.chat_model)}; new projects start on ${labelOf(SET.chat_default)}. Changing it here sets both.`

  const roleRow = (r) => {

      render();
    } }, modelOptions(r.saved, { vision: r.vision, dflt: `Default · ${labelOf(r.tier_default)}` }));
    return h("div", { class: "role" },
      h("div", { class: "rt" }, h("b", {}, r.label, r.vision ? h("span", { class: "tag", title: "Looks at video frames, so only models with vision are listed" }, "needs vision") : ""), h("span", {}, r.about)),
      sel, h("span", { class: "src" + (r.saved ? " saved" : "") }, r.saved ? "Your choice" : "Default for the Balanced quality level"));
  };

    const r = await api("/api/audit/settings", { [k]: Number(e.target.value) }); if (r) { AUDIT = r; changed("audit"); toast("Saved"); }
  } });
  return [
    h("h2", {}, "Models"),
    h("p", { class: "lede" }, "Choose which AI does each job. Only models from connected providers can be picked."),
    h("section", {}, h("h3", {}, "AI editor"), h("p", { class: "sub" }, "The assistant in the editor's chat pane that edits your video."),
      h("div", { class: "card role" }, h("div", { class: "rt" }, h("b", {}, "Chat model"), h("span", {}, chatNote)), chat)),
    h("section", {}, h("h3", {}, "Generation & review team"),
      h("p", { class: "sub" }, "Used by Generate and by the auditor. A choice made for one generation in the wizard still wins over these."),
      h("div", { class: "card" }, (ROLES?.roles || []).map(roleRow))),
    h("section", {}, h("h3", {}, "Auditor"), h("p", { class: "sub" }, "When an edit scores below the pass mark it goes back to the editor, up to the round limit."),
      h("div", { class: "card nums" },
        h("label", {}, "Pass mark (0–100)", numIn("threshold", 0, 100)),
        h("label", {}, "Revision rounds", numIn("max_rounds", 0, 8)))),
    h("p", { class: "hint" }, "Missing a model? ", h("a", { href: "#providers/add", onclick: (e) => { e.preventDefault(); go("providers/add"); } }, "Connect a provider"), "."),
  ];
}

// ---------- Providers & keys (registration) ----------
async function modelsApi(url, body) {
  const r = await api(url, body);
  if (r) await refreshModels(r.models);
  return r;
}
async function testModel(pid, id) { return (await api("/api/models/test", { provider: pid, id })) || { ok: false, text: "Request failed" }; }
function stopPoll() { clearInterval(POLL); POLL = null; }
async function signIn(kind, method = "claudeai") {
  const r = await api(kind === "install" ? "/api/ai/install" : "/api/ai/login", kind === "install" ? undefined : { method });
  if (!r) return;
  LOGIN = { kind, ...r }; render();
  stopPoll(); const t0 = Date.now();
  POLL = setInterval(() => { if (Date.now() - t0 > 10 * 60e3) { stopPoll(); LOGIN = null; render(); } else checkAI(); }, 2500);
}
const planLabel = (c) => { const p = c.subscriptionType || ""; return p ? ` · ${p[0].toUpperCase() + p.slice(1)} plan` : c.authMethod && c.authMethod !== "claude.ai" ? ` · ${c.authMethod}` : ""; };
function modelChip(m, pv) {
  const t = TESTS[m.key];
  const st = t ? (t.busy ? "busy" : t.ok ? "ok" : "bad") : "";
  return h("span", { class: `mchip ${st}`, title: `${m.id}${m.vision ? " · can see images" : " · no vision"}${t && !t.busy ? "\n" + t.text : pv.builtin ? "" : "\nClick to test"}`,
    onclick: pv.builtin ? null : async () => { TESTS[m.key] = { busy: true }; render(); TESTS[m.key] = await testModel(pv.id, m.id); render(); } },
    h("i", { class: "dot" }), m.label, m.vision ? icon("eye") : "",
    m.builtin ? "" : h("button", { class: "x", title: "Remove model", onclick: (e) => { e.stopPropagation(); modelsApi("/api/models/model/remove", { key: m.key }); } }, icon("x")));
}
function addModelInline(pv) {
  if (ADDM?.pid !== pv.id) return h("button", { class: "mchip add", onclick: async () => {
    ADDM = { pid: pv.id, id: "", vision: false, options: [] }; render();
    const r = await api("/api/models/discover", { provider: pv.id });
    if (ADDM?.pid === pv.id && r?.ok) { const have = new Set(PUB.models.map((m) => m.key)); ADDM.options = r.models.filter((m) => !have.has(`${pv.id}/${m.id}`)); render(); }
  } }, icon("plus"), "Add model");
  const tpl = PUB.templates.find((t) => t.id === pv.id);
  const listId = `sugg-${pv.id}`;
  const add = async (force) => {
    if (!ADDM.id) return toast("Enter a model id", true);
    if (!force) { ADDM.test = { busy: true }; render(); ADDM.test = await testModel(pv.id, ADDM.id); if (!ADDM.test.ok) return render(); }
    const r = await modelsApi("/api/models/model", { provider: pv.id, id: ADDM.id, label: ADDM.label || undefined, vision: ADDM.vision });
    if (r) { TESTS[`${pv.id}/${ADDM.id}`] = ADDM.test; ADDM = null; render(); }
  };

    h("input", { type: "text", placeholder: ADDM.options.length ? `pick from ${ADDM.options.length} models or type an id` : "model id", value: ADDM.id, list: listId, autofocus: true,
      oninput: (e) => { ADDM.id = e.target.value.trim(); const o = ADDM.options.find((x) => x.id === ADDM.id); ADDM.label = o?.label; if (o) { ADDM.vision = !!o.vision; const vb = e.target.parentNode.querySelector(".vcb"); if (vb) vb.checked = ADDM.vision; } },
      onkeydown: (e) => e.key === "Enter" && add(false) }),
    h("datalist", { id: listId }, (ADDM.options.length ? ADDM.options : tpl?.suggested || []).map((s) => h("option", { value: s.id }, s.label))),
    h("label", { title: "Tick if the model accepts images, so the AI can check rendered frames" }, h("input", { type: "checkbox", class: "vcb", checked: ADDM.vision, onchange: (e) => (ADDM.vision = e.target.checked) }), "vision"),
    h("button", { class: "primary", onclick: () => add(false), disabled: ADDM.test?.busy }, ADDM.test?.busy ? h("span", { class: "spin" }) : "", "Test & add"),
    h("button", { class: "ghost", onclick: () => { ADDM = null; render(); } }, "Cancel"),
    ADDM.test && !ADDM.test.busy && !ADDM.test.ok ? h("div", { class: "addm-err" }, h("span", {}, ADDM.test.text), h("button", { class: "ghost", onclick: () => add(true) }, "Add anyway")) : "");

    h("div", { class: "tiles" },
      tile("AI calls", num(T.calls)), tile("Tokens in", num(T.input_tokens), "incl. cached"), tile("Tokens out", num(T.output_tokens)),
      tile("Reported cost", T.cost_known ? usd(T.cost_usd) : "—", T.cost_known < T.calls ? `${T.calls - T.cost_known} calls without a price` : "")),
    dailyChart(USAGE),
    h("section", {}, h("h3", {}, "By model"), table(USAGE.models, "Model", (r) => [r.label, h("small", {}, r.key), h("i", { class: "bar", style: { width: `${(r.calls / max) * 100}%` } })])),
    h("section", {}, h("h3", {}, "By job"), table(USAGE.tasks, "Job", (r) => TASKS[r.key] || r.key)),
    partial ? h("p", { class: "hint" }, "* some calls in this row had no reported price.") : "",
  ];
}

// ---------- Updates ----------
async function loadUpdates() { UPD = await get("/api/update"); render(); }
async function updAction(label, url, body) {
  UPD_BUSY = label; render();
  const r = await api(url, body);
  UPD_BUSY = "";
  if (r) UPD = r;
  render();
  return r;
}
async function restartApp() {
  UPD_BUSY = "Restarting…"; render();
  if (await api("/api/update/restart")) {
    $("#page").replaceChildren(h("p", { class: "hint" }, h("span", { class: "spin" }), " Restarting aiklips — this window reopens in a moment."));
  } else { UPD_BUSY = ""; render(); }
}
// release notes are markdown from GitHub: show their bullet points as a list
function notesList(md) {
  const items = md.split("\n").map((l) => l.trim()).filter((l) => /^[-*] /.test(l)).map((l) => l.slice(2).replace(/\*\*|`/g, "").replace(/\s*\(#?[0-9a-f]{7,}\)$/, "")
    .replace(/^(feat|fix|perf|refactor|chore|docs|style|test|build|ci)(\([^)]*\))?!?:\s*/i, "").replace(/^./, (c) => c.toUpperCase()));
  if (!items.length) return h("div", { class: "card", style: { padding: "12px 16px", whiteSpace: "pre-wrap" } }, md);
  return h("ul", { class: "card notes" }, items.slice(0, 12).map((t) => h("li", {}, t)));
}

// ---------- General ----------
const FMT = [["reels", "9:16", 7, 12], ["portrait45", "4:5", 9, 11], ["square", "1:1", 10, 10], ["landscape", "16:9", 13, 7]];
function prow(title, sub, control) { return h("div", { class: "prow" }, h("div", { class: "pt" }, h("b", {}, title), h("span", {}, sub)), control); }
function toggle(on, onchange) { return h("label", { class: "switch" }, h("input", { type: "checkbox", checked: on, onchange: (e) => onchange(e.target.checked) }), h("i")); }
function pageGeneral() {
  const pr = AK.app?.prefs || {};
  const fmt = pr.format || "reels", fps = String(pr.fps || 30);
  const save = async (p) => { await AK.savePrefs(p); render(); toast("Saved"); };
  return [
    h("h2", {}, "General"), h("p", { class: "lede" }, "How aiklips starts new projects, looks and feels."),
    h("section", {}, h("h3", {}, "New projects"), h("div", { class: "card" },
      prow("Default format", "The shape new projects start in. Each project can still pick its own.",
        h("div", { class: "fmts" }, FMT.map(([id, label, w, ht]) => h("button", { class: fmt === id ? "on" : "", onclick: () => save({ format: id }) },
          h("i", { style: { width: w + "px", height: ht + "px" } }), label)))),
      prow("Frame rate", "Frames per second for new projects.",
        h("select", { onchange: (e) => save({ fps: +e.target.value }) }, ["24", "25", "30", "60"].map((v) => h("option", { value: v, selected: v === fps }, `${v} fps`)))),
      prow("Projects folder", AK.app?.projects_root || "", h("button", { onclick: () => copyText(AK.app?.projects_root || "") }, icon("copy"), "Copy path")))),
    h("section", {}, h("h3", {}, "Appearance"), h("div", { class: "card" },
      prow("Reduce motion", "Turn off the interface animations. Your system's reduce-motion setting is always respected.", toggle(!!pr.calm, (v) => save({ calm: v }))))),
    h("section", {}, h("h3", {}, "Help"), h("div", { class: "card" },
      prow("Welcome tour", "Connect your AI, pick a format and learn the editor in a minute.", h("button", { onclick: () => AK.welcome({ onDone: (a) => { if (a !== "explore") location.href = "/?do=" + (a === "import" ? "new" : a); } }) }, icon("help"), "Replay tour")),
      prow("What's new", "Highlights from recent versions.", h("button", { onclick: () => AK.whatsNew(AK.app?.all_notes, { all: true }) }, icon("gift"), "Show")),
      prow("Report a problem", "Opens a new issue on GitHub. Say what you did and what happened.", ext("https://github.com/TengkuMuzaffar/aiklips/issues/new", "Open GitHub")))),
    h("section", {}, h("h3", {}, "About"), h("div", { class: "card about" }, h("img", { src: "/static/logo.svg", alt: "" }),
      h("div", {}, h("b", {}, `aiklips ${AK.app?.version || ""}`), h("p", {}, "Free and open source under the MIT licence."),
        h("div", { class: "links" }, ext("https://aiklips.muzdev.online", "Website"), ext("https://github.com/TengkuMuzaffar/aiklips", "Source code"), h("a", { class: "ext", href: "#updates", onclick: (e) => { e.preventDefault(); go("updates"); } }, "Check for updates"))))),
  ];
}

function pageUpdates() {
  const head = [h("h2", {}, "Updates"), h("p", { class: "lede" }, "New versions come from the project's GitHub releases. They're signed, checked before installing, and your projects are never touched.")];
  if (!UPD) return [...head, h("p", { class: "hint" }, h("span", { class: "spin" }), " Loading…")];
  const U = UPD;
  if (!U.enabled) return [...head, h("div", { class: "card uhero ok" },
    h("div", { class: "uh-logo" }, h("img", { src: "/static/logo.svg", alt: "" })),
    h("div", { class: "uh-t" }, h("b", {}, `aiklips ${U.current}`), h("span", {}, "This copy runs from a source checkout, so it updates with git instead:"), codeLine("git pull && uv sync")))];
  const when = U.checked_at ? new Date(U.checked_at * 1000).toLocaleString() : "never";
  const busy = !!UPD_BUSY;
  const hero = (state, title, sub, ...acts) => h("div", { class: `card uhero ${state}` },
    h("div", { class: "uh-logo" }, h("img", { src: "/static/logo.svg", alt: "" }), h("span", { class: "uh-badge" }, icon(state === "ok" ? "check" : state === "busy" ? "refresh" : "download"))),
    h("div", { class: "uh-t" }, h("b", {}, title), h("span", {}, sub), acts.length ? h("div", { class: "btnrow" }, ...acts) : ""));
  let main;
  if (U.staged) main = [h("b", {}, `Version ${U.staged} is downloaded`), h("p", { class: "hint" }, "Restart to install it. If it doesn't start properly, aiklips goes back to this version on its own."),
    h("button", { class: "primary", disabled: busy, onclick: restartApp }, "Restart to update")];
  else if (U.available) main = [h("b", {}, `Version ${U.latest} is available`), h("p", { class: "hint" }, `You have ${U.current}.`),
    h("button", { class: "primary", disabled: busy, onclick: () => updAction("Downloading…", "/api/update/apply").then((r) => r && toast(`Downloaded ${r.staged}`)) }, icon("download"), "Download update")];
  else main = [h("b", {}, `aiklips ${U.current} is up to date`), h("p", { class: "hint" }, `Last checked: ${when}`)];
  const state = busy ? "busy" : U.staged || U.available ? "new" : "ok";
  const [t, sub, ...acts] = [main[0].textContent, busy ? UPD_BUSY : main[1].textContent, ...main.slice(2)];
  const cur = (AK.app?.all_notes || []).find((g) => g.version === U.current);
  return [...head,
    hero(state, t, sub, ...acts),
    cur ? h("section", {}, h("h3", {}, `In version ${U.current}`), h("div", { class: "card hl" }, cur.items.map((it) => h("div", { class: "hl-i" }, h("b", {}, it.title), h("span", {}, it.body))))) : "",
    U.available && U.notes ? h("section", {}, h("h3", {}, `What's new in ${U.latest}`), notesList(U.notes)) : "",
    h("section", {}, h("h3", {}, "Options"), h("div", { class: "card", style: { padding: "14px", display: "grid", gap: "10px", justifyItems: "start" } },
      h("label", { style: { display: "flex", gap: "8px", alignItems: "center" } },
        h("input", { type: "checkbox", checked: U.auto, onchange: (e) => updAction("", "/api/update/auto", { on: e.target.checked }) }), "Check for updates automatically"),
      h("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } },
        h("button", { disabled: busy, onclick: () => updAction("Checking…", "/api/update/check") }, "Check now"),
        U.previous ? h("button", { class: "ghost", disabled: busy, title: "Use the version you had before; takes effect on restart",
          onclick: async () => { if (await AK.confirm(`Go back to version ${U.previous}?`, { ok: "Go back" }) && await updAction("", "/api/update/rollback")) restartApp(); } }, `Go back to ${U.previous}`) : "",
        U.url ? ext(U.url, "Release notes") : ""))),
  ];
}

loadAll();
</script>
