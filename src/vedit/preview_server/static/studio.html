<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aiklips · Design studio</title>
<link rel="icon" href="/static/logo.svg">
<style>
:root {
  --bg: #090d0b; --pane: #0e1411; --pane2: #131b17; --pane3: #1a241f; --line: #1d2822; --line2: #2a3830;
  --text: #e9f0eb; --muted: #93a69b; --faint: #5f7167; --accent: #c5f467; --accent-ink: #0b2a1d;
  --work: #141917; --dots: #222b26; --danger: #f87171;
  --rail: 76px; --drawer: 344px; --tl: 236px; --top: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--pane2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
button:hover { background: var(--pane3); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { background: var(--pane2); }
button.icon { padding: 6px; display: inline-flex; align-items: center; justify-content: center; }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { font: inherit; color: var(--text); background: var(--pane2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 8px; outline: none; }
input[type=color] { padding: 0; width: 30px; height: 30px; border-radius: 8px; overflow: hidden; cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; } input[type=color]::-webkit-color-swatch { border: none; }
input[type=range] { accent-color: var(--accent); }
textarea { resize: vertical; width: 100%; }
.hint { color: var(--muted); font-size: 12px; }
.ic svg { width: 100%; height: 100%; }

/* ---- shell ---- */
#app { display: grid; grid-template-columns: var(--rail) auto 1fr; grid-template-rows: var(--top) 1fr; height: 100vh; }
#top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--pane); }
#top .sep { width: 1px; height: 22px; background: var(--line2); margin: 0 4px; }
#title { font-family: var(--display); font-style: italic; font-size: 19px; padding: 2px 8px; border-radius: 6px; outline: none; max-width: 32vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#title:hover { background: var(--pane2); } #title:focus { background: var(--pane2); box-shadow: 0 0 0 2px var(--accent-soft, #c5f4671a); }
#saved { color: var(--faint); font-size: 12px; }
#top .grow { flex: 1; }
#b-export { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 7px 16px; }
.menu { position: absolute; z-index: 40; background: var(--pane2); border: 1px solid var(--line2); border-radius: 12px; padding: 6px; min-width: 210px; box-shadow: 0 18px 50px -12px #000c; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; background: none; border: none; text-align: left; padding: 8px 10px; }
.menu button:hover { background: var(--pane3); }
.menu .k { margin-left: auto; color: var(--faint); font-size: 11px; }

/* ---- rail + drawer ---- */
#rail { background: var(--pane); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
#rail button { width: 62px; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 7px; background: none; border: none; border-radius: 10px; color: var(--muted); font-size: 10.5px; letter-spacing: .02em; }
#rail button .ic { width: 22px; height: 22px; }
#rail button:hover { color: var(--text); background: var(--pane2); }
#rail button.on { color: var(--text); background: var(--pane3); }
#rail button.on .ic { color: var(--accent); }
#rail .grow { flex: 1; }
#drawer { width: var(--drawer); background: var(--pane); border-right: 1px solid var(--line); position: relative; display: flex; flex-direction: column; min-height: 0; transition: width 220ms cubic-bezier(.2,.8,.2,1); }
#drawer.closed { width: 0; border-right: none; }
#drawer.closed > .dr-body, #drawer.closed > .dr-head { display: none; }
#dr-toggle { position: absolute; right: -14px; top: 50%; width: 22px; height: 64px; padding: 0; border-radius: 0 10px 10px 0; z-index: 5; background: var(--pane); border: 1px solid var(--line); border-left: none; color: var(--muted); }
.dr-head { padding: 14px 16px 8px; display: flex; align-items: center; gap: 8px; }
.dr-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
.dr-body { flex: 1; overflow: auto; padding: 4px 16px 18px; min-height: 0; }
.dr-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 18px 0 8px; font-weight: 600; }
.search { width: 100%; padding: 9px 12px; border-radius: 10px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { aspect-ratio: 1; border-radius: 10px; background: var(--pane2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: grab; position: relative; padding: 14px; transition: transform 160ms cubic-bezier(.34,1.56,.64,1), border-color 120ms; }
.tile:hover { border-color: var(--line2); transform: translateY(-2px); }
.tile:active { cursor: grabbing; }
.tile svg { max-width: 100%; max-height: 100%; }
.tile .lb { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--faint); opacity: 0; transition: opacity 120ms; }
.tile:hover .lb { opacity: 1; }
.tiles.wide { grid-template-columns: repeat(2, 1fr); }
.tiles.wide .tile { aspect-ratio: 16/10; padding: 0; overflow: hidden; }
.tiles.wide .tile img { width: 100%; height: 100%; object-fit: cover; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 9px; border: 1px solid #ffffff1a; cursor: pointer; }
.sw:hover { transform: scale(1.08); }
.textbtn { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 10px; }
.looks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.look { height: 64px; border-radius: 10px; background: #0b0f0d; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; font-size: 12px; text-align: center; padding: 4px; }
.look:hover { border-color: var(--line2); }
.look img { max-width: 100%; max-height: 100%; }
.drop { border: 1.5px dashed var(--line2); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.over, .drop:hover { border-color: var(--accent); color: var(--text); }

/* ---- workspace ---- */
#work { position: relative; display: grid; grid-template-rows: 62px 1fr var(--tl); min-width: 0; min-height: 0; background: var(--work); }
/* floating toolbar: only the selected element's own controls */
#ctx { height: 62px; display: flex; align-items: center; justify-content: center; padding: 10px 14px 0; position: relative; z-index: 6; }
#ctx.idle { pointer-events: none; }
#ctx .pill { display: flex; align-items: center; gap: 2px; background: var(--pane); border: 1px solid var(--line2); border-radius: 14px; padding: 5px 6px;
  box-shadow: 0 14px 36px -16px #000e, 0 1px 0 #ffffff08 inset; max-width: 100%; overflow-x: auto; scrollbar-width: none; animation: ak-pop 180ms var(--ease-out, ease) both; }
.tb { height: 36px; min-width: 36px; padding: 0 9px; border: none; background: none; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--text); white-space: nowrap; font-weight: 500; }
.tb:hover { background: var(--pane2); }
.tb.on { background: #c5f4671c; color: var(--accent); }
.tb-sep { width: 1px; height: 24px; background: var(--line2); margin: 0 5px; flex: none; }
.tb-label { padding: 0 10px; color: var(--muted); white-space: nowrap; }
.tb-glyph { font-size: 16px; font-family: Georgia, serif; min-width: 12px; text-align: center; }
b.tb-glyph { font-family: var(--sans); font-weight: 800; }
.tb-A { display: inline-flex; flex-direction: column; align-items: center; font-weight: 700; font-size: 17px; line-height: 1; }
.tb-A i { display: block; width: 20px; height: 4px; border-radius: 2px; margin-top: 2px; border: 1px solid #ffffff22; }
.sw-dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #ffffff40; display: block; }
.tb-font { width: 150px; height: 36px; background: var(--pane2); }
.tb-kind { height: 36px; background: var(--pane2); width: 128px; }
.tb-size { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 9px; margin: 0 4px; }
.tb-size .tb { height: 34px; min-width: 30px; font-size: 16px; }
.tb-num { width: 46px; text-align: center; border: none; background: transparent; padding: 4px 0; -moz-appearance: textfield; }
.tb-num::-webkit-inner-spin-button { display: none; }
/* popovers under toolbar buttons */
.pop { position: fixed; z-index: 60; background: var(--pane2); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; min-width: 240px; max-width: 300px;
  box-shadow: 0 20px 50px -14px #000e; animation: ak-pop 160ms var(--ease-out, ease) both; }
.pop .ph { font-weight: 600; margin-bottom: 8px; }
.pop .pl2 { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin: 10px 0 6px; }
.pop .swatches { gap: 6px; }
.pop .sw { width: 26px; height: 26px; border-radius: 50%; padding: 0; }
.pop .sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.prow { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
.prow .pl { width: 64px; color: var(--muted); font-size: 12px; flex: none; }
.prow input[type=range] { flex: 1; }
.prow input[type=number] { width: 80px; }
.prow .v { color: var(--muted); font-size: 12px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.pbtn { display: block; width: 100%; text-align: left; margin-top: 6px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; }
.chip.on { background: #c5f4671f; border-color: var(--accent); color: var(--accent); }
/* floating mini bar above the selection */
.mini { position: absolute; transform: translate(-50%, -100%); display: flex; gap: 2px; padding: 3px; background: var(--pane); border: 1px solid var(--line2);
  border-radius: 11px; box-shadow: 0 10px 24px -10px #000d; pointer-events: auto; z-index: 3; }
.mini button { border: none; background: none; width: 32px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }
.mini button:hover { background: var(--pane3); }
/* Properties / Effects panels */
.phead { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 6px; }
.phead .pt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.phead b { font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.psec { border-top: 1px solid var(--line); padding: 4px 0 10px; }
.psec:first-of-type { border-top: none; }
.psec .field { flex-wrap: wrap; }
.field.col { flex-direction: column; align-items: stretch; }
.field.col > span:first-child { width: auto; }
.field .ro { color: var(--text); font-size: 12.5px; flex: 1; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid2 .field > span:first-child { width: 58px; }
.grid2 .field input { width: 100%; }
.seg { display: inline-flex; background: var(--pane2); border: 1px solid var(--line2); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: none; background: none; padding: 4px 10px; border-radius: 7px; color: var(--muted); }
.seg button.on { background: var(--pane3); color: var(--accent); }
textarea.big { min-height: 64px; font-size: 14px; }
.row2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.fx { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; background: var(--pane2); }
.fx.on { border-color: #c5f46755; }
.fx-h { display: flex; align-items: center; justify-content: space-between; }
.blends { display: flex; flex-wrap: wrap; gap: 6px; }
.scn.picked { box-shadow: 0 0 0 2px var(--accent), 0 12px 26px -10px #000e; }
.hd.mv { cursor: move; }
.selbox.bgsel { border: 2px solid var(--accent); box-shadow: 0 0 0 4px #c5f4671f; }
.swatches.bgs { gap: 8px; }
.swatches.bgs .sw { width: 44px; height: 44px; border-radius: 10px; padding: 0; }
.swatches.bgs .sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
#stagewrap { position: relative; overflow: hidden; background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 18px 18px; }
#cv { position: absolute; overflow: hidden; box-shadow: 0 30px 80px -20px #000d, 0 0 0 1px #ffffff10; }
#cv .L { position: absolute; left: 0; top: 0; transform-origin: center center; will-change: transform; }
#cv .L.bgl { pointer-events: none; }
#cv .L img, #cv .L svg { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; -webkit-user-drag: none; }
#cv .L video, #cv .L canvas { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
#cv .vl-border { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
#over { position: absolute; inset: 0; pointer-events: none; }
.selbox { position: absolute; left: 0; top: 0; border: 1.5px solid var(--accent); transform-origin: center center; pointer-events: none; }
.selbox.sub { border-style: dashed; border-color: #c5f467aa; }
.hd { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border: 1.5px solid var(--accent); border-radius: 50%; pointer-events: auto; box-shadow: 0 1px 4px #0008; }
.hd.e { width: 7px; height: 20px; margin: -10px 0 0 -3.5px; border-radius: 4px; }
.hd.n { width: 20px; height: 7px; margin: -3.5px 0 0 -10px; border-radius: 4px; }
.hd.rot { width: 24px; height: 24px; margin: -12px 0 0 -12px; display: flex; align-items: center; justify-content: center; color: #111; font-size: 16px; font-weight: 700; line-height: 1; cursor: grab; }
.dims { position: absolute; padding: 2px 7px; border-radius: 6px; background: #000c; color: #fff; font-size: 11px; white-space: nowrap; pointer-events: none; transform: translate(-50%, 0); }
.guide { position: absolute; background: #ff4fa3; pointer-events: none; }
.marquee { position: absolute; border: 1px solid var(--accent); background: #c5f46714; pointer-events: none; }
.path { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
#zoom { position: absolute; right: 14px; bottom: 12px; display: flex; gap: 4px; align-items: center; background: var(--pane); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
#zoom span { min-width: 44px; text-align: center; color: var(--muted); font-size: 12px; }
#inline-edit { position: absolute; z-index: 20; background: #000c; color: #fff; border: 1.5px solid var(--accent); border-radius: 8px; padding: 8px; font-size: 18px; text-align: center; resize: none; }
#cv-empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--muted); pointer-events: none; }
#cv-empty b { display: block; font-family: var(--display); font-style: italic; font-weight: 400; font-size: 28px; color: var(--text); margin-bottom: 6px; }

/* ---- timeline ---- */
#tl { border-top: 1px solid var(--line); background: var(--pane); display: grid; grid-template-rows: 40px 1fr; min-height: 0; position: relative; }
#transport { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line); }
#b-play { width: 32px; height: 32px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--text); color: #0b0f0d; border: none; }
#time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 120px; }
#time b { color: var(--text); font-weight: 600; }
#b-rec.on { color: #ff5a5a; border-color: #ff5a5a66; }
#tl-scroll { overflow: auto; position: relative; min-height: 0; }
#tl-inner { position: relative; padding: 14px 16px 10px 16px; min-width: 100%; }
#scenes { display: flex; gap: 0; height: 64px; position: relative; margin-bottom: 8px; }
.scn { position: relative; height: 56px; margin-top: 4px; border-radius: 10px; border: 1.5px solid var(--line2); background: var(--pane2); overflow: hidden; cursor: pointer; flex: none; transition: transform 200ms cubic-bezier(.34,1.56,.64,1), box-shadow 200ms; }
.scn + .scn { margin-left: 4px; }
.scn.cur { border-color: var(--accent); transform: translateY(-8px); box-shadow: 0 12px 26px -10px #000e; z-index: 2; }
.scn .bgc { position: absolute; inset: 0; opacity: .8; }
.scn .nm { position: absolute; left: 8px; top: 6px; right: 26px; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; }
.scn .du { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #ffffffcc; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
.scn .tr { position: absolute; right: 8px; bottom: 6px; font-size: 10px; color: #ffffffaa; text-transform: uppercase; letter-spacing: .06em; }
.scn .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 9px; cursor: ew-resize; }
.scn .grip:hover, .scn.resizing .grip { background: #c5f46755; }
.scn .more { position: absolute; right: 4px; top: 3px; padding: 0 4px; font-size: 14px; line-height: 16px; border: none; background: transparent; color: #fff; opacity: 0; }
.scn:hover .more { opacity: .85; }
.scn.dragging { opacity: .6; }
#add-scene { height: 56px; margin-top: 4px; margin-left: 6px; width: 48px; border-style: dashed; flex: none; font-size: 20px; color: var(--muted); }
#rows { position: relative; }
.row { position: relative; height: 26px; margin-bottom: 4px; }
.bar { position: absolute; top: 2px; height: 22px; border-radius: 6px; background: var(--pane3); border: 1px solid var(--line2); cursor: grab; display: flex; align-items: center; padding: 0 8px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.bar.on { border-color: var(--accent); color: var(--text); background: #1f2d22; }
.bar .ed { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
.bar .ed.l { left: 0; } .bar .ed.r { right: 0; }
.bar .kf { position: absolute; top: 6px; width: 9px; height: 9px; margin-left: -4.5px; background: var(--accent); transform: rotate(45deg); border-radius: 1px; cursor: pointer; }
.bar .tag { margin-left: 6px; color: var(--faint); }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; z-index: 5; }
#playhead::before { content: ""; position: absolute; top: -2px; left: -5px; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
#tl-ruler { position: absolute; left: 0; right: 0; top: 0; height: 14px; cursor: col-resize; }

/* ---- panels ---- */
.field { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.field > span:first-child { width: 86px; color: var(--muted); font-size: 12px; flex: none; }
.field input:not([type=color]):not([type=range]), .field select { flex: 1; min-width: 0; }
.field input[type=range] { flex: 1; }
.tabs { display: flex; gap: 4px; background: var(--pane2); padding: 3px; border-radius: 10px; margin: 6px 0 10px; }
.tabs button { flex: 1; border: none; background: none; padding: 6px; border-radius: 8px; color: var(--muted); }
.tabs button.on { background: var(--pane3); color: var(--text); }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pre { border-radius: 10px; background: var(--pane2); border: 1.5px solid var(--line); padding: 8px 4px 6px; text-align: center; cursor: pointer; font-size: 11px; color: var(--muted); }
.pre .demo { height: 44px; display: flex; align-items: center; justify-content: center; }
.pre .demo i { display: block; width: 22px; height: 22px; border-radius: 6px; background: var(--muted); }
.pre:hover { border-color: var(--line2); color: var(--text); }
.pre:hover .demo i { background: var(--accent); }
.pre.on { border-color: var(--accent); color: var(--text); }
.pre.on .demo i { background: var(--accent); }
.kfl { display: grid; grid-template-columns: 1fr auto 26px; gap: 6px; align-items: center; margin: 4px 0; }
.kfl .v { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.dia { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.dia i { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--muted); border-radius: 1px; }
.dia.on i { background: var(--accent); border-color: var(--accent); }
.card { background: var(--pane2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.card.cur { border-color: var(--accent); }
.card .hd2 { display: flex; align-items: center; gap: 6px; }
.card .hd2 input { flex: 1; font-weight: 600; background: transparent; border-color: transparent; padding: 4px; }
.card .hd2 input:focus { border-color: var(--line2); }
.card .row2 { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.card .row2 input[type=number] { width: 64px; }
.card textarea { margin-top: 6px; min-height: 46px; font-size: 12px; }
.ai-box { background: linear-gradient(160deg, #18261d, #101612); border: 1px solid #2b3d31; border-radius: 14px; padding: 12px; margin-bottom: 14px; }
.ai-box b { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 18px; }
.ai-box textarea { margin: 8px 0; min-height: 70px; }
.ai-box .row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.primary:hover { background: #d3f985; }
.proposal { border: 1px solid var(--accent); border-radius: 12px; padding: 10px; margin: 8px 0 14px; background: #c5f4670d; }
.proposal ol { margin: 6px 0; padding-left: 18px; color: var(--muted); }
.proposal li b { color: var(--text); }

/* chat */
#chat { display: flex; flex-direction: column; height: 100%; min-height: 0; }
#chat .msgs { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0 10px; min-height: 120px; }
.m-user { align-self: flex-end; background: var(--pane3); border-radius: 12px 12px 4px 12px; padding: 8px 10px; max-width: 90%; white-space: pre-wrap; }
.m-ai { background: var(--pane2); border-radius: 12px 12px 12px 4px; padding: 8px 10px; line-height: 1.5; }
.m-ai p { margin: 0 0 6px; } .m-ai p:last-child { margin: 0; }
.m-tool { color: var(--faint); font-size: 11.5px; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-tool .ok { color: var(--accent); } .m-tool .bad { color: var(--danger); }
.m-err { color: var(--danger); } .m-meta, .m-note { color: var(--faint); font-size: 11.5px; }
.m-perm { border: 1px solid var(--line2); border-radius: 10px; padding: 8px; }
.m-perm code { display: block; font-size: 11px; margin: 6px 0; white-space: pre-wrap; word-break: break-all; color: var(--muted); }
.composer { border: 1px solid var(--line2); border-radius: 12px; padding: 6px; background: var(--pane2); }
.composer textarea { border: none; background: transparent; min-height: 54px; resize: none; padding: 4px; }
.composer textarea:focus { box-shadow: none; }
.composer .row2 { display: flex; gap: 6px; align-items: center; }
.composer select { max-width: 170px; font-size: 12px; padding: 4px 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { font-size: 11.5px; padding: 5px 9px; border-radius: 99px; }

/* presenting (Preview) */
body.present #top, body.present #rail, body.present #drawer, body.present #ctx, body.present #tl, body.present #zoom, body.present #over { display: none !important; }
body.present #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
body.present #work { grid-template-rows: 1fr; grid-column: 1 / -1; grid-row: 1 / -1; background: #000; }
body.present #stagewrap { background: #000; }
#present-x { position: fixed; top: 14px; right: 16px; z-index: 50; display: none; }
body.present #present-x { display: inline-flex; }
dialog { background: var(--pane); color: var(--text); border: 1px solid var(--line2); border-radius: 16px; padding: 20px; min-width: 380px; }
dialog::backdrop { background: #000a; }
.prog { height: 6px; border-radius: 6px; background: var(--pane3); overflow: hidden; margin: 12px 0; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 300ms; }
</style>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ghost icon" id="b-home" title="Home"></button>
    <button class="ghost" id="b-file">File</button>
    <button class="ghost" id="b-resize">Resize</button>
    <span class="sep"></span>
    <button class="ghost icon" id="b-undo" title="Undo (⌘Z)"></button>
    <button class="ghost icon" id="b-redo" title="Redo (⇧⌘Z)"></button>
    <span id="saved">Saved</span>
    <div class="grow"></div>
    <div id="title" contenteditable="true" spellcheck="false" title="Rename"></div>
    <div class="grow"></div>
    <button class="ghost" id="b-check" title="Run the auditor on this design">Check</button>
    <button id="b-preview" title="Play full screen (P)">Preview</button>
    <button id="b-export">Export</button>
  </header>
  <nav id="rail"></nav>
  <aside id="drawer">
    <div class="dr-head"><h2 id="dr-title"></h2></div>
    <div class="dr-body" id="dr-body"></div>
    <button id="dr-toggle" title="Hide panel">‹</button>
  </aside>
  <main id="work">
    <div id="ctx"></div>
    <div id="stagewrap">
      <div id="cv"></div>
      <div id="over"></div>
      <div id="cv-empty"></div>
      <div id="zoom">
        <button class="ghost icon" id="z-out" title="Zoom out">−</button><span id="z-val">Fit</span><button class="ghost icon" id="z-in" title="Zoom in">+</button>
        <button class="ghost" id="z-fit">Fit</button>
      </div>
    </div>
    <section id="tl">
      <div id="transport">
        <button id="b-play" title="Play / pause (Space)"></button>
        <span id="time"></span>
        <button class="ghost" id="b-rec" title="Record motion: dragging, stretching or rotating at the playhead adds keyframes">● Record</button>
        <span class="hint" id="tl-hint"></span>
        <div style="flex:1"></div>
        <span class="hint" id="sel-hint"></span>
      </div>
      <div id="tl-scroll"><div id="tl-inner"><div id="tl-ruler"></div><div id="scenes"></div><div id="rows"></div><div id="playhead"></div></div></div>
    </section>
  </main>
</div>
<button id="present-x">Exit preview (Esc)</button>
<dialog id="dlg-export"></dialog>
<input type="file" id="file-in" multiple hidden accept="image/*,video/*,audio/*">
<script src="/static/shell.js"></script>
<script src="/static/animate.js"></script>
<script src="/static/shapes.js"></script>
<script src="/static/studio.js"></script>
</body>
</html>
