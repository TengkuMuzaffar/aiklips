<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-cut</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0b0d10; --pane: #12151a; --pane2: #181c22; --pane3: #20252d; --line: #262c35; --line2: #333a45;
  --text: #e6e9ef; --muted: #8a93a3; --faint: #5d6574; --accent: #5eead4; --accent-ink: #062a25;
  --clip: #23344f; --clip-b: #4a6fa8; --text-l: #2f4a2a; --text-b: #6aa860; --img-l: #3a2f4f; --img-b: #9a7fd0;
  --cap-l: #4a3c18; --cap-b: #d0a640; --mus-l: #173a45; --mus-b: #3fa5c0; --sel: #fbbf24; --danger: #f87171; --ok: #4ade80;
  --col: 340px; --row: 58%;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--pane3); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button.icon { padding: 5px; width: 28px; height: 28px; }
.ic { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover { color: var(--text); border-color: var(--line2); }
button.danger:hover { border-color: var(--danger); color: var(--danger); }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 7px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type=color] { padding: 1px; height: 26px; width: 44px; }
input[type=range] { accent-color: var(--accent); }
kbd { background: var(--pane3); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; font-size: 11px; color: var(--muted); }

/* ---- header ---- */
header { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--pane); }
.logo { font-weight: 700; letter-spacing: .2px; }
.logo span { color: var(--accent); }
#proj-name { color: var(--muted); }
.spacer { flex: 1; }
.pill { padding: 3px 10px; border-radius: 999px; background: var(--pane3); color: var(--muted); font-size: 12px; }
.pill.rendering { color: #fde68a; } .pill.error { color: var(--danger); } .pill.ready { color: var(--accent); }

/* ---- 4-pane grid ---- */
#grid { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--col) 5px 1fr; grid-template-rows: var(--row) 5px 1fr; }
.pane { background: var(--pane); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane-h { height: 34px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--pane2); }
.pane-h h2 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.splitter { background: var(--line); }
.splitter:hover, .splitter.drag { background: var(--accent); }
#split-v { grid-column: 2; grid-row: 1 / 4; cursor: col-resize; }
#split-h { grid-column: 1 / 4; grid-row: 2; cursor: row-resize; z-index: 2; }
#p-insp { grid-column: 1; grid-row: 1; }
#p-prev { grid-column: 3; grid-row: 1; }
#p-chat { grid-column: 1; grid-row: 3; }
#p-tl { grid-column: 3; grid-row: 3; }

/* ---- inspector ---- */
.tabs { display: flex; gap: 2px; }
.tab { background: transparent; border: none; padding: 4px 9px; border-radius: 6px; color: var(--muted); }
.tab.on { background: var(--pane3); color: var(--text); }
#insp-body { flex: 1; overflow: auto; padding: 10px 12px 20px; }
.crumb { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
.crumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
.sec { margin: 0 0 14px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sec-h h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--pane2); }
.row.sel { border-color: var(--sel); background: #2a2413; }
.row .tag { font: 11px ui-monospace, monospace; color: var(--muted); min-width: 34px; }
.row .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.empty { color: var(--faint); font-size: 12px; padding: 4px 8px; }
.bin { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.bin { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.src { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: grab; background: var(--pane2); transition: border-color .12s; }
.src:hover { border-color: var(--line2); }
.src.sel { border-color: var(--sel); }
.src .th { position: relative; aspect-ratio: 16 / 10; background: #000 center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.src .th .ic { width: 22px; height: 22px; }
.src .dur { position: absolute; right: 5px; bottom: 5px; font: 10px ui-monospace, monospace; background: #000b; color: var(--text); padding: 1px 5px; border-radius: 4px; }
.src .kind { position: absolute; left: 5px; top: 5px; background: #000b; border-radius: 4px; padding: 2px; color: var(--text); }
.src .kind .ic { width: 12px; height: 12px; }
.src .nm { font-size: 11px; padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.dropzone { border: 1px dashed var(--line2); border-radius: 10px; padding: 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--faint); text-align: center; font-size: 12px; }
.dropzone > .ic { width: 26px; height: 26px; color: var(--muted); }
.fields { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 7px 10px; align-items: center; }
.fields label { color: var(--muted); font-size: 12px; }
.fields .full { grid-column: 1 / 3; }
.fields .pair { display: flex; gap: 6px; align-items: center; }
.fields .pair > * { flex: 1; min-width: 0; }
.fields .pair > input[type=color], .fields .pair > .hint { flex: none; }
.fields input:not([type=checkbox]):not([type=color]), .fields select, .fields textarea { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; gap: 4px; align-items: center; background: var(--pane3); border: 1px solid var(--line2); border-radius: 999px; padding: 1px 4px 1px 9px; font-size: 12px; }
.chip button { padding: 0 5px; border: none; background: transparent; color: var(--muted); }
.chip button:hover { color: var(--danger); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.hint { color: var(--faint); font-size: 12px; }
#hist { list-style: none; margin: 0; padding: 0; }
#hist li { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; color: var(--muted); }
#hist li:hover { background: var(--pane2); }
#hist li.current { background: #15322e; color: var(--text); }
#hist li.future { opacity: .45; }
#hist .n { width: 28px; text-align: right; font-variant-numeric: tabular-nums; color: var(--faint); }

/* ---- preview ---- */
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; position: relative; background: radial-gradient(circle at 50% 40%, #151a21, var(--bg)); }
video { max-height: 100%; max-width: 100%; background: #000; border-radius: 10px; box-shadow: 0 10px 40px #0009; }
#badge { position: absolute; top: 14px; right: 16px; }
#nomedia > .ic { width: 34px; height: 34px; }
#nomedia { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--muted); text-align: center; padding: 20px; }
.transport { height: 42px; flex: none; display: flex; align-items: center; justify-content: center; gap: 4px; border-top: 1px solid var(--line); background: var(--pane2); }
#tc { font: 12px ui-monospace, monospace; color: var(--muted); min-width: 150px; text-align: center; }

/* ---- chat ---- */
#msgs { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.m-user { align-self: flex-end; max-width: 88%; background: #1d3a36; border: 1px solid #275049; padding: 7px 10px; border-radius: 12px 12px 3px 12px; white-space: pre-wrap; }
.m-user .ctx { display: block; font-size: 11px; color: var(--accent); opacity: .8; margin-bottom: 2px; }
.m-ai { max-width: 94%; line-height: 1.5; }
.m-ai code { background: var(--pane3); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.m-tool { font: 12px ui-monospace, monospace; color: var(--muted); display: flex; gap: 6px; align-items: baseline; padding-left: 4px; }
.m-tool .st { width: 12px; flex: none; }
.m-tool .st.ok { color: var(--ok); } .m-tool .st.bad { color: var(--danger); }
.m-tool .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-meta { font-size: 11px; color: var(--faint); padding-left: 4px; }
.m-err { color: var(--danger); font-size: 12px; white-space: pre-wrap; }
.m-note { color: var(--faint); font-size: 12px; font-style: italic; }
.m-perm { border: 1px solid var(--danger); border-radius: 8px; padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; }
.m-perm code { white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
.m-perm .btns { display: flex; gap: 6px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.suggest button { font-size: 12px; border-radius: 999px; }
#composer { flex: none; border-top: 1px solid var(--line); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: var(--pane2); }
#ctxchip { align-self: flex-start; font-size: 11px; color: var(--accent); background: #0f2a26; border: 1px solid #1f4a43; border-radius: 999px; padding: 1px 8px; }
#composer .in { display: flex; gap: 8px; align-items: flex-end; }
#prompt { flex: 1; resize: none; min-height: 38px; max-height: 140px; }
.typing { color: var(--muted); font-size: 12px; padding-left: 4px; }
.typing i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 3px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }

/* ---- timeline ---- */
.tl-tools { display: flex; align-items: center; gap: 2px; }
.tl-tools .sep { width: 1px; height: 18px; background: var(--line2); margin: 0 6px; }
.tl-tools input[type=range] { width: 96px; }
#tl-body { flex: 1; min-height: 0; overflow: auto; position: relative; display: grid; grid-template-columns: 116px 1fr; align-content: start; }
#tl-heads { position: sticky; left: 0; z-index: 4; background: var(--pane2); border-right: 1px solid var(--line); }
#tl-scroll { position: relative; min-width: 0; }
#tl-inner { position: relative; }
.head { height: var(--h); display: flex; align-items: center; gap: 7px; padding: 0 8px 0 7px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); border-left: 3px solid var(--c, transparent); white-space: nowrap; overflow: hidden; }
.head .ic { width: 14px; height: 14px; color: var(--c, var(--muted)); }
.head .hn { overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.head .hs { margin-left: auto; font: 10px ui-monospace, monospace; color: var(--faint); }
.head.ruler-h { font: 10px ui-monospace, monospace; color: var(--faint); border-left-color: transparent; }
.lane { position: relative; height: var(--h); border-bottom: 1px solid var(--line); }
.lane.ruler { background: var(--pane2); cursor: ew-resize; }
.lane.drop { background: #13302b; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line2); font-size: 10px; color: var(--faint); padding-left: 3px; padding-top: 2px; }
.tick.minor { border-left-color: var(--line); top: 16px; }
.blk { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; border: 1px solid; overflow: hidden; cursor: grab; user-select: none; touch-action: none; }
.blk .bl { position: absolute; left: 10px; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 5px; font-size: 11px; white-space: nowrap; overflow: hidden; pointer-events: none; text-shadow: 0 1px 2px #000; }
.blk .bl .ic { width: 12px; height: 12px; opacity: .9; }
.blk .bl .nm { overflow: hidden; text-overflow: ellipsis; }
.blk .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 0 4px; border-radius: 3px; background: #0009; flex: none; }
.blk .badge .ic { width: 10px; height: 10px; }
.blk.clip .bl { left: 0; right: 0; top: 0; bottom: auto; height: 18px; padding: 0 8px; background: var(--clip); border-bottom: 1px solid #0006; }
.blk .hd { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
.blk .hd.l { left: 0; } .blk .hd.r { right: 0; }
.blk .hd:hover { background: #fff3; }
.blk.sel { border-color: var(--sel) !important; box-shadow: 0 0 0 1px var(--sel); }
.blk.drag { opacity: .85; z-index: 5; cursor: grabbing; box-shadow: 0 6px 20px #000a; }
.blk.clip { background-color: var(--clip); background-repeat: repeat-x; background-position: 0 18px; background-size: auto calc(100% - 18px); border-color: var(--clip-b); }
.blk.text { background: var(--text-l); border-color: var(--text-b); }
.blk.image { background: var(--img-l); border-color: var(--img-b); }
.blk.captions { background: var(--cap-l); border-color: var(--cap-b); }
.blk.music { background: var(--mus-l); border-color: var(--mus-b); }
.lane.wave { background: var(--pane2) 0 50% / 100% 100% no-repeat; }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; z-index: 6; }
#playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top-color: var(--accent); }
#insmark { position: absolute; top: 0; width: 3px; margin-left: -1px; background: var(--sel); display: none; z-index: 7; border-radius: 2px; }
#tl-empty { position: absolute; inset: 5px 8px; border: 1px dashed var(--line2); border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--faint); font-size: 12px; pointer-events: none; }
#tl-empty button { pointer-events: auto; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--pane3); border: 1px solid var(--line2); padding: 8px 14px; border-radius: 9px; display: none; z-index: 50; max-width: 70vw; box-shadow: 0 8px 30px #000a; }
#toast.err { border-color: var(--danger); color: #fecaca; }
#dropveil { position: fixed; inset: 0; background: #0b0d10cc; border: 2px dashed var(--accent); display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); z-index: 40; pointer-events: none; }
</style>
</head>
<body>
<header>
  <button class="ghost" id="b-home" data-icon="grid" title="Back to all projects">Projects</button>
  <div class="logo">claude<span>-</span>cut</div>
  <div id="proj-name"></div>
  <div class="spacer"></div>
  <span class="pill" id="status">connecting…</span>
  <button class="ghost icon" id="b-undo" data-icon="undo" title="Undo (⌘Z)"></button>
  <button class="ghost icon" id="b-redo" data-icon="redo" title="Redo (⇧⌘Z)"></button>
  <button class="primary" id="b-export" data-icon="download"><span class="lb">Export</span></button>
</header>

<div id="grid">
  <!-- 1. project / inspector -->
  <section class="pane" id="p-insp">
    <div class="pane-h">
      <div class="tabs"><button class="tab on" data-tab="inspector">Properties</button><button class="tab" data-tab="media">Media</button><button class="tab" data-tab="history">History</button></div>
    </div>
    <div id="insp-body"></div>
  </section>
  <div class="splitter" id="split-v"></div>

  <!-- 2. preview -->
  <section class="pane" id="p-prev">
    <div class="pane-h"><h2>Preview</h2><div class="spacer"></div><span class="hint" id="canvas-info"></span></div>
    <div id="stage">
      <video id="video" playsinline preload="auto"></video>
      <span class="pill" id="badge" style="display:none">rendering…</span>
      <div id="nomedia"><span data-icon="film"></span><div>Drop a video anywhere to start,<br>or ask the AI in the chat.</div><button id="b-import2" data-icon="upload">Import media</button></div>
    </div>
    <div class="transport">
      <button class="ghost icon" id="t-start" data-icon="skip-back" title="Go to start (Home)"></button>
      <button class="ghost icon" id="t-back" data-icon="chevron-left" title="Previous frame (←)"></button>
      <button class="icon" id="t-play" data-icon="play" title="Play / pause (Space)" style="width:36px;height:32px"></button>
      <button class="ghost icon" id="t-fwd" data-icon="chevron-right" title="Next frame (→)"></button>
      <span id="tc">0:00.00 / 0:00.00</span>
    </div>
  </section>
  <div class="splitter" id="split-h"></div>

  <!-- 3. AI chat -->
  <section class="pane" id="p-chat">
    <div class="pane-h"><h2>AI editor</h2><div class="spacer"></div><select id="model" title="Model used by the AI editor" style="max-width:150px;font-size:12px"></select><button class="ghost" id="b-newchat" title="Start a new conversation">New chat</button></div>
    <div id="msgs"></div>
    <div id="composer">
      <span id="ctxchip"></span>
      <div class="in">
        <textarea id="prompt" rows="1" placeholder="Ask the AI to edit…"></textarea>
        <button class="primary" id="b-send">Send</button>
      </div>
    </div>
  </section>

  <!-- 4. timeline -->
  <section class="pane" id="p-tl">
    <div class="pane-h">
      <h2>Timeline</h2>
      <div class="spacer"></div>
      <div class="tl-tools">
        <button class="ghost icon" id="b-split" data-icon="scissors" title="Split at playhead (S)"></button>
        <button class="ghost icon danger" id="b-del" data-icon="trash" title="Delete selected (⌫)"></button>
        <span class="sep"></span>
        <button class="ghost icon" id="b-import" data-icon="film-plus" title="Add video or image"></button>
        <button class="ghost icon" id="b-addtext" data-icon="type" title="Add text at playhead (T)"></button>
        <button class="ghost icon" id="b-addmusic" data-icon="music" title="Add music"></button>
        <span class="sep"></span>
        <button class="ghost icon" id="b-zout" data-icon="zoom-out" title="Zoom out (−)"></button>
        <input type="range" id="zoom" min="15" max="400" value="90" title="Zoom">
        <button class="ghost icon" id="b-zin" data-icon="zoom-in" title="Zoom in (+)"></button>
        <button class="ghost icon" id="b-fit" data-icon="fit" title="Fit timeline to window"></button>
      </div>
    </div>
    <div id="tl-body">
      <div id="tl-heads"></div>
      <div id="tl-scroll"><div id="tl-inner"></div></div>
    </div>
  </section>
</div>
<input type="file" id="file" multiple accept="video/*,audio/*,image/*" hidden>
<input type="file" id="file-music" accept="audio/*" hidden>
<div id="toast"></div>
<div id="dropveil">Drop to import</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const video = $("#video");
let ST = null;               // server state
let SEL = null;              // {kind: clip|layer|music|source, id}
let TAB = "inspector";
let PPS = 90;                // timeline pixels per second
let lastVideoVersion = -1;
let fitPending = true;

// ---------- utils ----------
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") { for (const [sk, sv] of Object.entries(v)) sk.startsWith("--") ? el.style.setProperty(sk, sv) : (el.style[sk] = sv); }
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
// one outline icon set (24px grid, 1.75 stroke) used everywhere
const ICONS = {
  grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',

function icon(name) {
  const el = document.createElement("span"); el.className = "ic";
  el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
  return el;
}
document.querySelectorAll("[data-icon]").forEach((el) => el.prepend(icon(el.dataset.icon)));
const fmt = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return `${m}:${(t - m * 60).toFixed(2).padStart(5, "0")}`; };
const P = () => ST.project;
const fps = () => (ST ? P().canvas.fps : 30);
const dur = () => (ST ? ST.duration : 0);
const clipStart = (id) => ST.starts[P().clips.findIndex((c) => c.id === id)];
const clipDur = (c) => (c.out - c.in) / c.speed;
const layerEnd = (l) => (l.end == null ? dur() : Math.min(l.end, dur()));
function toast(msg, err = false) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.tm); toast.tm = setTimeout(() => (t.style.display = "none"), err ? 5000 : 2200);
}
async function api(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { let d = "Error"; try { d = (await r.json()).detail; } catch {} toast(d, true); return null; }
  return r.json();
}
async function op(name, args) { const r = await api("/api/op", { op: name, args }); if (r) await refresh(); return r; }
function layerLabel(l) {
  if (l.type === "text") return l.text || "";
  if (l.type === "image") return (l.image || "").split(/[\\/]/).pop();
  return l.words.slice(0, 6).map((w) => w.text).join(" ");
}
function sourceName(s) { return s.path.split(/[\\/]/).pop(); }

// ---------- state ----------
async function refresh() {
  const res = await fetch("/api/state");
  if (res.status === 409) { location.href = "/"; return; }
  ST = await res.json();
  if (SEL && !selExists()) SEL = null;
  $("#proj-name").textContent = P().name;
  $("#canvas-info").textContent = `${P().canvas.width}×${P().canvas.height} · ${P().canvas.fps}fps · ${fmt(dur())}`;
  $("#nomedia").style.display = P().clips.length ? "none" : "flex";
  video.style.display = P().clips.length ? "" : "none";
  setStatus(ST.render);
  const editing = $("#insp-body").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!editing) renderInspector();
  renderTimeline();
  updateCtx();
}
function selExists() {
  const p = P();
  if (SEL.kind === "clip") return p.clips.some((c) => c.id === SEL.id);
  if (SEL.kind === "layer") return p.layers.some((l) => l.id === SEL.id);
  if (SEL.kind === "music") return p.music.some((m) => m.id === SEL.id);
  if (SEL.kind === "source") return SEL.id in p.sources;
  return false;
}
function select(sel) { SEL = sel; TAB = "inspector"; setTabs(); renderInspector(); renderTimeline(); updateCtx(); }
function setStatus(r) {
  const el = $("#status");
  el.className = "pill " + (r.error ? "error" : r.status === "rendering" ? "rendering" : "ready");
  el.textContent = r.error ? "render error" : r.status === "rendering" ? "rendering preview…" : "up to date";
  el.title = r.error || "";
  $("#badge").style.display = r.status === "rendering" ? "" : "none";
}
function reloadVideo() {
  const t = video.currentTime, playing = !video.paused, v = Date.now();
  video.src = `/media/preview.mp4?v=${v}`;
  video.addEventListener("loadedmetadata", () => { video.currentTime = Math.min(t, video.duration || t); if (playing) video.play(); }, { once: true });
  const clipsLane = $(".lane.clips");
  if (clipsLane) renderTimeline();
}

// ---------- inspector (pane 1) ----------
function setTabs() { document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === TAB)); }
document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { TAB = b.dataset.tab; setTabs(); renderInspector(); }));

function field(label, el) { return [h("label", {}, label), el]; }
function numIn(value, commit, step = 0.1, attrs = {}) {
  return h("input", { type: "number", step, value: value ?? "", ...attrs, onchange: (e) => commit(e.target.value) });
}
function textIn(value, commit, attrs = {}) { return h("input", { type: "text", value: value ?? "", ...attrs, onchange: (e) => commit(e.target.value) }); }
function colorIn(value, commit) {

}
function selectIn(value, options, commit) {
  return h("select", { onchange: (e) => commit(e.target.value) }, options.map(([v, l]) => h("option", { value: v, selected: v === value }, l)));
}
function rangeIn(value, min, max, step, commit) {
  const out = h("span", { class: "hint" }, Number(value).toFixed(2));
  const r = h("input", { type: "range", min, max, step, value, oninput: (e) => (out.textContent = Number(e.target.value).toFixed(2)), onchange: (e) => commit(e.target.value) });

function renderInspector() {
  const body = $("#insp-body"); body.innerHTML = "";
  if (!ST) return;
  if (TAB === "history") return body.append(renderHistory());
  if (TAB === "media") return body.append(...renderMedia());
  if (!SEL) return body.append(...renderRoot());
  const p = P();
  if (SEL.kind === "clip") body.append(...renderClip(p.clips.find((c) => c.id === SEL.id)));
  else if (SEL.kind === "layer") body.append(...renderLayer(p.layers.find((l) => l.id === SEL.id)));
  else if (SEL.kind === "music") body.append(...renderMusic(p.music.find((m) => m.id === SEL.id)));
  else if (SEL.kind === "source") body.append(...renderSource(SEL.id, p.sources[SEL.id]));
}

function renderRoot() {
  const p = P(), c = p.canvas;
  const presets = [["reels", "9:16 Reels / TikTok"], ["portrait45", "4:5 Feed"], ["square", "1:1 Square"], ["landscape", "16:9 YouTube"]];
  const cur = { "1080x1920": "reels", "1080x1350": "portrait45", "1080x1080": "square", "1920x1080": "landscape" }[`${c.width}x${c.height}`] || "";
  const project = h("div", { class: "sec" },
    h("div", { class: "sec-h" }, h("h3", {}, "Project")),
    h("div", { class: "fields" },
      field("Name", textIn(p.name, (v) => op("rename", { name: v }))),
      field("Format", selectIn(cur, cur ? presets : [["", `${c.width}×${c.height}`], ...presets], (v) => v && op("canvas_set", { preset: v }))),
      field("Frame rate", selectIn(String(c.fps), [["24", "24 fps"], ["25", "25 fps"], ["30", "30 fps"], ["60", "60 fps"]], (v) => op("canvas_set", { fps: v }))),
      field("Background", colorIn(c.background, (v) => op("canvas_set", { background: v }))),
      h("div", { class: "full hint" }, ST.project_dir)));

  const tip = h("p", { class: "hint", style: { marginTop: "14px" } }, "Select a clip, text or music block on the timeline to edit its properties here.");

}

function renderMedia() {
  const p = P(), srcs = Object.entries(p.sources);
  const head = h("div", { class: "sec-h" }, h("h3", {}, `Media · ${srcs.length}`),
    h("button", { class: "ghost", onclick: () => $("#file").click() }, icon("upload"), "Import"));
  if (!srcs.length) return [head, h("div", { class: "dropzone" }, icon("upload"),

  return [head, h("div", { class: "bin" }, srcs.map(([id, s]) => {

    return h("div", { class: "src" + (SEL?.id === id ? " sel" : ""), draggable: true, title: `${sourceName(s)} · ${fmt(s.duration)} — drag onto the timeline`,

}

// ---------- timeline (pane 4) ----------
const LANES = { ruler: 24, clips: 66, wave: 34, layer: 28 };
function timeAt(clientX) { const r = $("#tl-inner").getBoundingClientRect(); return Math.max(0, (clientX - r.left) / PPS); }
function seek(t) { video.currentTime = Math.max(0, Math.min(dur(), t)); updateTC(); updateCtx(); }
function snapPoints(exclude) {
  const pts = [0, dur(), video.currentTime, ...ST.starts];
  for (const l of P().layers) if (l.id !== exclude) pts.push(l.start, layerEnd(l));
  return pts;
}
function snap(t, exclude) {
  const tol = 8 / PPS; let best = t, bd = tol;
  for (const p of snapPoints(exclude)) { const d = Math.abs(p - t); if (d < bd) { bd = d; best = p; } }
  return best;
}

function renderTimeline() {
  const heads = $("#tl-heads"), inner = $("#tl-inner");
  heads.innerHTML = ""; inner.innerHTML = "";
  if (!ST) return;
  const p = P(), D = dur();
  if (fitPending && D > 0) { fitPending = false; fitZoom(false); }
  const width = Math.max(D * PPS + 160, $("#tl-scroll").clientWidth);
  inner.style.width = width + "px";
  const lanes = [];
  const lane = (cls, hgt, ic, name, sub, color) => {
    heads.append(h("div", { class: "head" + (ic ? "" : " ruler-h"), style: { "--h": hgt + "px", "--c": color || "" }, title: sub ? `${name} ${sub}` : name || "" },
      ic ? icon(ic) : "", h("span", { class: "hn" }, name || ""), sub ? h("span", { class: "hs" }, sub) : ""));
    const el = h("div", { class: "lane " + cls, style: { "--h": hgt + "px" } }); inner.append(el); lanes.push(el); return el;
  };

  // ruler
  const ruler = lane("ruler", LANES.ruler, null, fmt(D));
  const stepS = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60].find((s) => s * PPS >= 70) || 60;
  for (let t = 0; t <= width / PPS; t += stepS) {
    const lab = t >= 60 ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}` : `${+t.toFixed(2)}s`;
    ruler.append(h("div", { class: "tick", style: { left: `${t * PPS}px` } }, lab));
    if (stepS * PPS > 140) ruler.append(h("div", { class: "tick minor", style: { left: `${(t + stepS / 2) * PPS}px` } }));
  }
  ruler.addEventListener("pointerdown", (e) => {
    seek(timeAt(e.clientX)); ruler.setPointerCapture(e.pointerId);
    const mv = (ev) => seek(timeAt(ev.clientX));
    ruler.addEventListener("pointermove", mv);
    ruler.addEventListener("pointerup", () => ruler.removeEventListener("pointermove", mv), { once: true });
  });

  // video clips
  const vl = lane("clips", LANES.clips, "film", "Video", "", "var(--clip-b)");
  p.clips.forEach((c, i) => {
    const s = ST.starts[i], d = clipDur(c);
    const b = h("div", { class: "blk clip" + (SEL?.id === c.id ? " sel" : ""), title: `${c.id} · ${fmt(s)}–${fmt(s + d)}`,
      style: { left: `${s * PPS}px`, width: `${Math.max(6, d * PPS - 2)}px`, backgroundImage: `url(/api/source/${c.source}/thumb.jpg)` } },
      h("div", { class: "hd l" }), h("div", { class: "hd r" }),
      h("div", { class: "bl" }, h("span", { class: "nm" }, sourceName(p.sources[c.source])),
        c.speed !== 1 ? h("span", { class: "badge", title: "Speed" }, icon("gauge"), `${c.speed}×`) : "",
        c.effects.length ? h("span", { class: "badge", title: c.effects.map((e) => e.type).join(", ") }, icon("sparkle"), c.effects.length) : "",
        c.zoom !== 1 || c.zoom_to ? h("span", { class: "badge", title: "Zoom" }, icon("zoom-in")) : ""));
    b.addEventListener("pointerdown", (e) => clipPointer(e, b, c, i));
    vl.append(b);
  });
  vl.append(h("div", { id: "insmark", style: { height: `${LANES.clips}px` } }));
  vl.addEventListener("pointerdown", (e) => { if (e.target === vl) { seek(timeAt(e.clientX)); select(null); } });
  setupDrop(vl);

  // audio waveform
  const wl = lane("wave", LANES.wave, "wave", "Audio", "", "var(--muted)");
  if (D) wl.style.backgroundImage = `url(/media/wave.png?v=${ST.render.version})`;
  wl.style.backgroundSize = `${D * PPS}px 100%`;
  wl.addEventListener("pointerdown", (e) => seek(timeAt(e.clientX)));

  // overlay layers (top layer first, like most editors)
  [...p.layers].reverse().forEach((l) => {
    const meta = { text: ["type", "Text", "var(--text-b)"], image: ["image", "Image", "var(--img-b)"], captions: ["captions", "Captions", "var(--cap-b)"] }[l.type];
    const el = lane("", LANES.layer, meta[0], meta[1], l.id, meta[2]);
    const s = l.start, e = layerEnd(l);
    const b = h("div", { class: `blk ${l.type}` + (SEL?.id === l.id ? " sel" : ""), title: `${l.id} · ${fmt(s)}–${fmt(e)} · ${layerLabel(l)}`,
      style: { left: `${s * PPS}px`, width: `${Math.max(6, (e - s) * PPS - 1)}px` } },
      h("div", { class: "hd l" }), h("div", { class: "hd r" }),
      h("div", { class: "bl" }, icon(meta[0]), h("span", { class: "nm" }, layerLabel(l) || l.id),
        l.presets.length ? h("span", { class: "badge", title: l.presets.map((x) => x.name).join(", ") }, icon("sparkle"), l.presets.length) : ""));
    b.addEventListener("pointerdown", (ev) => spanPointer(ev, b, s, e, (ns, ne, mode) => {
      const args = { layer: l.id, start: +ns.toFixed(3) };
      if (mode !== "l" || l.end != null) args.end = +ne.toFixed(3);
      return op("layer_set", args);
    }, () => select({ kind: "layer", id: l.id }), l.id));
    el.append(b);
    el.addEventListener("pointerdown", (ev) => { if (ev.target === el) seek(timeAt(ev.clientX)); });
  });

  // music
  p.music.forEach((m) => {
    const el = lane("", LANES.layer, "music", "Music", m.id, "var(--mus-b)");
    const s = m.start;
    const b = h("div", { class: "blk music" + (SEL?.id === m.id ? " sel" : ""), title: `${m.id} · vol ${m.volume}`, style: { left: `${s * PPS}px`, width: `${Math.max(6, (D - s) * PPS - 1)}px` } },
      h("div", { class: "bl" }, icon("music"), h("span", { class: "nm" }, sourceName(p.sources[m.source])),
        h("span", { class: "badge", title: "Volume" }, icon("volume"), Math.round(m.volume * 100) + "%"), m.duck ? h("span", { class: "badge", title: "Lowers under speech" }, "duck") : ""));
    b.addEventListener("pointerdown", (ev) => spanPointer(ev, b, s, D, (ns) => op("music_set", { music: m.id, start: +ns.toFixed(3) }), () => select({ kind: "music", id: m.id }), m.id, true));
    el.append(b);
  });

  if (!p.clips.length) vl.append(h("div", { id: "tl-empty" }, "Drop video here or drag from Media",
    h("button", { class: "ghost", onclick: () => $("#file").click() }, icon("upload"), "Import")));
  inner.append(h("div", { id: "playhead" }));
  const ph = $("#playhead"); ph.style.left = `${video.currentTime * PPS}px`;
}

// drag a clip: body = reorder, edges = trim
function clipPointer(e, b, c, idx) {
  e.preventDefault(); e.stopPropagation();
  const mode = e.target.classList.contains("l") ? "l" : e.target.classList.contains("r") ? "r" : "move";
  const x0 = e.clientX, s0 = ST.starts[idx], d0 = clipDur(c), src = P().sources[c.source];
  let moved = false, target = idx, nin = c.in, nout = c.out;
  const mark = $("#insmark");
  b.setPointerCapture(e.pointerId);
  const onMove = (ev) => {
    const dx = ev.clientX - x0;
    if (!moved && Math.abs(dx) < 4) return;
    moved = true; b.classList.add("drag");
    const dt = dx / PPS;
    if (mode === "move") {
      b.style.transform = `translateX(${dx}px)`;
      const t = timeAt(ev.clientX);
      const others = P().clips.map((x, i) => ({ x, s: ST.starts[i], d: clipDur(x) })).filter((o) => o.x.id !== c.id);
      target = others.filter((o) => o.s + o.d / 2 < t).length;
      const markT = target < others.length ? others[target].s : (others.length ? others[others.length - 1].s + others[others.length - 1].d : 0);
      mark.style.display = "block"; mark.style.left = `${markT * PPS}px`;
    } else if (mode === "l") {
      nin = Math.max(0, Math.min(c.out - 0.05, c.in + dt * c.speed));
      const nd = (c.out - nin) / c.speed;
      b.style.left = `${(s0 + d0 - nd) * PPS}px`; b.style.width = `${nd * PPS}px`;
      b.title = `in ${nin.toFixed(2)}s`;
    } else {
      nout = Math.min(src.duration, Math.max(c.in + 0.05, c.out + dt * c.speed));
      b.style.width = `${((nout - c.in) / c.speed) * PPS}px`;
      b.title = `out ${nout.toFixed(2)}s`;
    }
  };
  const onUp = async () => {
    b.removeEventListener("pointermove", onMove);
    mark.style.display = "none";
    if (!moved) { select({ kind: "clip", id: c.id }); return; }
    if (mode === "move") { if (target !== idx) await op("move_clip", { clip: c.id, index: target }); else renderTimeline(); }
    else await op("retime_clip", { clip: c.id, in: +nin.toFixed(3), out: +nout.toFixed(3) });
  };
  b.addEventListener("pointermove", onMove);
  b.addEventListener("pointerup", onUp, { once: true });
}

// drag a layer/music block: body = move, edges = change start / end
function spanPointer(e, b, s0, e0, commit, onClick, id, moveOnly = false) {
  e.preventDefault(); e.stopPropagation();
  let mode = e.target.classList.contains("l") ? "l" : e.target.classList.contains("r") ? "r" : "move";
  if (moveOnly) mode = "move";
  const x0 = e.clientX; let moved = false, ns = s0, ne = e0;
  b.setPointerCapture(e.pointerId);
  const onMove = (ev) => {
    const dx = ev.clientX - x0;
    if (!moved && Math.abs(dx) < 4) return;
    moved = true; b.classList.add("drag");
    const dt = dx / PPS;
    if (mode === "move") { ns = Math.max(0, snap(s0 + dt, id)); ne = moveOnly ? e0 : ns + (e0 - s0); }
    else if (mode === "l") ns = Math.max(0, Math.min(e0 - 0.05, snap(s0 + dt, id)));
    else ne = Math.max(s0 + 0.05, snap(e0 + dt, id));
    b.style.left = `${ns * PPS}px`; b.style.width = `${Math.max(6, (ne - ns) * PPS)}px`;
    b.title = `${fmt(ns)} – ${fmt(ne)}`;
  };
  const onUp = async () => {
    b.removeEventListener("pointermove", onMove);
    if (!moved) return onClick();
    await commit(ns, ne, mode);
  };
  b.addEventListener("pointermove", onMove);
  b.addEventListener("pointerup", onUp, { once: true });
}

// dropping media onto the video lane (from the Project bin or from the OS)
function dropIndex(clientX) {
  const t = timeAt(clientX);
  return P().clips.filter((c, i) => ST.starts[i] + clipDur(c) / 2 < t).length;
}
function setupDrop(vl) {
  vl.addEventListener("dragover", (e) => {
    e.preventDefault(); e.stopPropagation(); vl.classList.add("drop");
    const i = dropIndex(e.clientX), mark = $("#insmark");
    mark.style.display = "block"; mark.style.left = `${(i < P().clips.length ? ST.starts[i] : dur()) * PPS}px`;
  });
  vl.addEventListener("dragleave", () => { vl.classList.remove("drop"); $("#insmark").style.display = "none"; });
  vl.addEventListener("drop", async (e) => {
    e.preventDefault(); e.stopPropagation(); vl.classList.remove("drop"); $("#insmark").style.display = "none"; $("#dropveil").style.display = "none";
    const index = dropIndex(e.clientX);
    const sid = e.dataTransfer.getData("application/x-vedit-source");
    if (sid) {
      const s = P().sources[sid];
      if (s.has_video) await op("insert_source", { source: sid, index });
      else await op("add_music", { source: sid, start: timeAt(e.clientX) });
      return;
    }
    await uploadFiles([...e.dataTransfer.files], true, index);
  });
}
async function uploadFiles(files, append, index) {
  let i = index;
  for (const f of files) {
    toast(`Importing ${f.name}…`);
    const fd = new FormData(); fd.append("file", f); fd.append("append", append ? "true" : "false");
    if (i != null) fd.append("index", String(i));
    const r = await fetch("/api/import", { method: "POST", body: fd });
    if (!r.ok) { let d = "Import failed"; try { d = (await r.json()).detail; } catch {} toast(d, true); continue; }
    const res = await r.json();
    if (!res.has_video) await api("/api/op", { op: "add_music", args: { source: res.source, start: 0 } });
    if (res.clip && i != null) i++;
  }
  await refresh(); toast("Imported");
}
// drop anywhere else in the window → import to the end of the timeline

// ---------- header ----------
$("#b-home").onclick = () => { location.href = "/"; };
$("#b-undo").onclick = () => api("/api/undo").then(refresh);
$("#b-redo").onclick = () => api("/api/redo").then(refresh);
$("#b-export").onclick = async () => {
  const b = $("#b-export"), lb = $(".lb", b); b.disabled = true; lb.textContent = "Exporting…";
  const r = await api("/api/export");
  b.disabled = false; lb.textContent = "Export";
  if (r) toast(`Exported ${r.width}×${r.height} · ${r.duration}s → ${r.output}`);
};

// ---------- splitters ----------
function splitter(el, axis) {
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId); el.classList.add("drag");
    const grid = $("#grid").getBoundingClientRect();
    const mv = (ev) => {
      if (axis === "x") document.documentElement.style.setProperty("--col", `${Math.max(240, Math.min(grid.width - 400, ev.clientX - grid.left))}px`);
      else document.documentElement.style.setProperty("--row", `${Math.max(160, Math.min(grid.height - 160, ev.clientY - grid.top))}px`);
    };
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", () => { el.removeEventListener("pointermove", mv); el.classList.remove("drag"); renderTimeline();
      try { localStorage.setItem("cc-layout", JSON.stringify({ col: getComputedStyle(document.documentElement).getPropertyValue("--col"), row: getComputedStyle(document.documentElement).getPropertyValue("--row") })); } catch {} }, { once: true });
  });
}
splitter($("#split-v"), "x"); splitter($("#split-h"), "y");
try { const l = JSON.parse(localStorage.getItem("cc-layout") || "null"); if (l) { document.documentElement.style.setProperty("--col", l.col); document.documentElement.style.setProperty("--row", l.row); } } catch {}

// ---------- keyboard ----------
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); (e.shiftKey ? $("#b-redo") : $("#b-undo")).click(); return; }
  if (typing) return;
  if (e.key === " ") { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if (e.key === "ArrowLeft") step(e.shiftKey ? -fps() : -1);
  else if (e.key === "ArrowRight") step(e.shiftKey ? fps() : 1);
  else if (e.key === "Home") seek(0);
  else if (e.key.toLowerCase() === "s") op("split", { at: video.currentTime });
  else if (e.key.toLowerCase() === "t") addTextAtPlayhead();
  else if (e.key === "Delete" || e.key === "Backspace") deleteSelected();
  else if (e.key === "Escape") select(null);
  else if (e.key === "=" || e.key === "+") { PPS = Math.min(400, PPS * 1.25); $("#zoom").value = PPS; renderTimeline(); }
  else if (e.key === "-") { PPS = Math.max(15, PPS / 1.25); $("#zoom").value = PPS; renderTimeline(); }
});
window.addEventListener("resize", () => renderTimeline());

// ---------- live updates ----------
const es = new EventSource("/api/events");
es.onmessage = async (m) => {
  const d = JSON.parse(m.data);
  if (d.closed) { es.close(); location.href = "/"; return; }
  await refresh();
  if (d.status === "idle" && !d.error && d.version !== lastVideoVersion && P().clips.length) { lastVideoVersion = d.version; reloadVideo(); }
};
es.onerror = () => { const s = $("#status"); s.className = "pill error"; s.textContent = "disconnected"; };

refresh().then(() => { if (P().clips.length) reloadVideo(); });
connectChat();
</script>
</body>
</html>
