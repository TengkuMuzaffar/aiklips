<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06261c"><!-- Edge / Chrome --app colour their title bar with this: no white bar on Windows -->
<meta name="color-scheme" content="dark">
<title>aiklips setup</title>
<link rel="icon" type="image/png" href="/icon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #06261c; --forest-2: #0a3527; --forest-3: #0f4433;
    --lime: #c5f467; --lime-2: #b2e64d; --lime-ink: #0b2a1d;
    --on: #e9f1ec; --muted: #9fb8ac; --faint: #5f7d70; --line: #ffffff14;
    --err: #ff8a7a;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--forest); color: var(--on); font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  /* atmosphere: a faint grid and a lime glow behind the logo */
  .bg { position: fixed; inset: 0; pointer-events: none; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse 70% 55% at 50% 22%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 22%, #000 10%, transparent 75%);
  }
  .bg::after {
    content: ""; position: absolute; left: 50%; top: 120px; width: 420px; height: 300px; translate: -50% -50%;
    background: radial-gradient(closest-side, #c5f46733, transparent); filter: blur(10px);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .55; scale: .92; } }

  main { position: relative; flex: 1; display: flex; flex-direction: column; padding: 48px 40px 22px; }
  .logo { width: 76px; height: 76px; margin: 0 auto 22px; position: relative; animation: rise .7s var(--ease) both; }
  .logo .tile { position: absolute; inset: 0; border-radius: 22px; background: var(--forest-2);
    box-shadow: inset 0 0 0 1px #c5f46726, 0 18px 40px -16px #000c; }
  .logo svg { position: absolute; inset: 14px; overflow: visible; }
  .logo .spark { transform-origin: 16px 16px; animation: spin 9s linear infinite; }
  .logo .spark line { stroke: var(--lime); stroke-width: 3.2; stroke-linecap: round;
    stroke-dasharray: 22; animation: draw 1.1s var(--ease) both; }
  .logo .spark line:nth-child(2) { animation-delay: .08s; }
  .logo .spark line:nth-child(3) { animation-delay: .16s; }
  .logo .spark line:nth-child(4) { animation-delay: .24s; }
  .logo::after { content: ""; position: absolute; inset: -8px; border-radius: 28px; border: 1px solid #c5f46740;
    animation: ping 2.4s var(--ease) infinite; }
  .done-state .logo .spark { animation: spin 1.2s var(--ease) 1 both; }
  .done-state .logo::after { animation: none; opacity: 0; }
  .error-state .logo .spark { animation: none; }
  .error-state .logo .spark line { stroke: var(--muted); }
  .error-state .logo::after { animation: none; opacity: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes draw { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
  @keyframes ping { 0% { opacity: .9; scale: .96; } 80%, 100% { opacity: 0; scale: 1.18; } }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }

  h1 { margin: 0; text-align: center; font-weight: 500; font-size: 26px; letter-spacing: -.02em; line-height: 1.2;
    animation: rise .7s .08s var(--ease) both; }
  h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--lime); letter-spacing: 0; font-size: 1.12em; }
  .sub { margin: 8px auto 0; max-width: 34ch; text-align: center; color: var(--muted); text-wrap: balance;
    animation: rise .7s .14s var(--ease) both; }

  .steps { list-style: none; margin: 30px 0 0; padding: 0; display: grid; gap: 4px; }
  .step { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; color: var(--faint);
    transition: color .3s, background .3s; animation: rise .6s var(--ease) both; }
  .step.active { color: var(--on); background: #ffffff0a; }
  .step.done { color: var(--muted); }
  .step.error { color: var(--err); background: #ff8a7a12; }
  .dot { width: 20px; height: 20px; flex: none; position: relative; display: grid; place-items: center; }
  .dot::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1.5px solid currentColor;
    opacity: .6; transition: all .35s var(--ease); }
  .active .dot::before { inset: 1px; border-color: #c5f46733; border-top-color: var(--lime); opacity: 1;
    animation: spin .8s linear infinite; }
  .done .dot::before { inset: 1px; background: var(--lime); border-color: var(--lime); opacity: 1; animation: pop .45s var(--ease); }
  .error .dot::before { inset: 1px; background: var(--err); border-color: var(--err); opacity: 1; }
  .dot svg { position: absolute; left: 4.5px; top: 4.5px; width: 11px; height: 11px; opacity: 0; scale: .4; transition: all .35s var(--ease) .05s; }
  .done .dot svg.ok, .error .dot svg.x { opacity: 1; scale: 1; }
  .dot svg path { fill: none; stroke: var(--lime-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes pop { 0% { scale: .5; } 60% { scale: 1.15; } 100% { scale: 1; } }
  .step .t { flex: 1; }

  .progress { margin-top: auto; padding-top: 20px; }
  .bar { height: 8px; border-radius: 99px; background: #ffffff12; overflow: hidden; position: relative; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, var(--lime-2), var(--lime)); box-shadow: 0 0 18px #c5f46766;
    transition: width .5s var(--ease); }
  .fill::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent, #ffffff70, transparent); background-size: 50% 100%;
    background-repeat: no-repeat; animation: sheen 1.6s linear infinite; }
  .error-state .fill { background: var(--faint); box-shadow: none; }
  .error-state .fill::after, .done-state .fill::after { display: none; }
  @keyframes sheen { from { background-position: -100% 0; } to { background-position: 200% 0; } }
  .meta { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; min-height: 19px; }
  .meta .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .meta .pct { color: var(--on); font-weight: 500; flex: none; }
  .stats { margin-top: 2px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; min-height: 18px; }

  .error-card { display: none; margin-top: 18px; padding: 16px; border-radius: 14px; background: #ff8a7a14;
    border: 1px solid #ff8a7a33; animation: rise .4s var(--ease) both; }
  .error-state .error-card { display: block; }
  .error-state .progress { display: none; }
  .error-state .steps { margin-top: 22px; }
  .error-state .step { padding-block: 6px; }
  .error-card p { margin: 0 0 14px; color: var(--on); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; font-weight: 500; border: 0; border-radius: 99px; padding: 8px 16px;
    cursor: pointer; transition: transform .15s var(--ease), background .2s, color .2s; }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  .primary { background: var(--lime); color: var(--lime-ink); }
  .primary:hover { background: #d4fb85; }
  .ghost { background: #ffffff10; color: var(--on); }
  .ghost:hover { background: #ffffff1c; }

  footer { position: relative; display: flex; justify-content: space-between; padding: 14px 40px 18px;
    font-size: 11.5px; color: var(--faint); border-top: 1px solid var(--line); }
  footer a { color: inherit; text-decoration: none; cursor: pointer; }
  footer a:hover { color: var(--muted); }

  .closing main, .closing footer { transition: opacity .3s, translate .3s var(--ease); opacity: 0; translate: 0 -6px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <div class="logo" aria-hidden="true">
    <div class="tile"></div>
    <svg viewBox="0 0 32 32"><g class="spark">
      <line x1="16" y1="5" x2="16" y2="27"/><line x1="5" y1="16" x2="27" y2="16"/>
      <line x1="8.2" y1="8.2" x2="23.8" y2="23.8"/><line x1="23.8" y1="8.2" x2="8.2" y2="23.8"/>
    </g></svg>
  </div>
  <h1 id="title">Setting up <em>aiklips</em></h1>
  <p class="sub" id="sub">Getting everything ready.</p>

  <ol class="steps" id="steps" aria-live="polite"></ol>

  <div class="error-card" role="alert">
    <p id="err"></p>
    <div class="row">
      <button class="primary" id="retry">Try again</button>
      <button class="ghost" id="copy">Copy details</button>
      <button class="ghost" id="log">Show log</button>
    </div>
  </div>

  <div class="progress">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span class="label" id="label">Starting…</span><span class="pct" id="pct" title="All of setup, not just this download">0%</span></div>
    <div class="stats" id="stats"></div>
  </div>
</main>
<footer><span>Free &amp; open source</span><a id="footlog">Launcher <span id="ver"></span></a></footer>

<template id="step-tpl">
  <li class="step"><span class="dot">
    <svg class="ok" viewBox="0 0 12 12"><path d="M2.5 6.3 5 8.6l4.6-5"/></svg>
    <svg class="x" viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg>
  </span><span class="t"></span></li>
</template>

<script>
  const token = new URLSearchParams(location.search).get("t") || "";
  const $ = (id) => document.getElementById(id);
  let last = null, shown = 0, target = 0, details = "";

  const mb = (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(b < 1e7 ? 1 : 0) + " MB";
  const eta = (s) => s < 0 ? "" : s < 10 ? "a few seconds left" : s < 60 ? `about ${Math.round(s / 5) * 5} s left`
    : `about ${Math.round(s / 60)} min left`;

  // the title keeps "aiklips" in the brand's serif
  function title(t) {
    const i = t.lastIndexOf("aiklips");
    if (i < 0) return document.createTextNode(t);
    const f = document.createDocumentFragment(), em = document.createElement("em");
    f.append(t.slice(0, i)); em.textContent = "aiklips"; f.append(em, t.slice(i + 7));
    return f;
  }

  function renderSteps(steps) {
    const ol = $("steps");
    if (ol.children.length !== steps.length) {
      ol.textContent = "";
      steps.forEach((s, i) => {
        const li = $("step-tpl").content.firstElementChild.cloneNode(true);
        li.style.animationDelay = `${120 + i * 60}ms`;
        ol.append(li);
      });
    }
    steps.forEach((s, i) => {
      const li = ol.children[i];
      li.className = "step " + s.state;
      li.querySelector(".t").textContent = s.label;
    });
  }

  function render(s) {
    document.body.classList.toggle("error-state", !!s.error);
    document.body.classList.toggle("done-state", s.finished && !s.error);
    if (s.title && (!last || last.title !== s.title)) { $("title").replaceChildren(title(s.title)); }
    $("sub").textContent = s.error ? "Your projects are safe. Most problems go away on a second try." : s.sub || "";
    if (s.finished && !s.error) $("sub").textContent = "All set. Opening the editor…";
    renderSteps(s.steps || []);
    target = Math.max(s.error ? target : 0, Math.min(1, s.overall || 0));
    $("label").textContent = s.finished ? "Opening aiklips…" : s.label || "Working…";
    $("stats").textContent = s.bytes && s.total > 0
      ? [`${mb(s.done)} of ${mb(s.total)} downloaded`, s.speed > 1e4 ? `${(s.speed / 1e6).toFixed(1)} MB/s` : "", eta(s.eta)].filter(Boolean).join("  ·  ")
      : "";
    $("err").textContent = s.error || "";
    details = s.details || "";
    $("ver").textContent = s.version && s.version !== "dev" ? "v" + s.version : "";
    if (s.close) { document.body.classList.add("closing"); setTimeout(() => window.close(), 280); }
    last = s;
  }

  // ease the shown percentage towards the target so the bar and number never jump
  function tick() {
    shown += (target - shown) * 0.12;
    if (Math.abs(target - shown) < 0.0005) shown = target;
    $("fill").style.width = (shown * 100).toFixed(2) + "%";
    const pct = Math.floor(shown * 100);
    $("pct").textContent = pct + "%";
    $("bar").setAttribute("aria-valuenow", pct);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function connect() {
    const es = new EventSource("/events?t=" + encodeURIComponent(token));
    es.onmessage = (e) => render(JSON.parse(e.data));
    es.onerror = () => { es.close(); if (!(last && last.close)) setTimeout(connect, 1000); };
  }
  connect();

  const post = (path) => fetch(path + "?t=" + encodeURIComponent(token), { method: "POST" });
  $("retry").onclick = () => { document.body.classList.remove("error-state"); post("/retry"); };
  $("log").onclick = $("footlog").onclick = () => post("/open-log");
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(details); $("copy").textContent = "Copied"; }
    catch { $("copy").textContent = "Couldn't copy"; }
    setTimeout(() => ($("copy").textContent = "Copy details"), 1600);
  };
</script>
</body>
</html>
